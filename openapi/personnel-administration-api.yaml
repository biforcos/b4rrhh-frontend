  /employees/{ruleSystemCode}/{employeeTypeCode}/{employeeNumber}/work-centers:
    post:
      operationId: createWorkCenterByBusinessKey
      summary: Add a work center assignment to the employee's series
      description: >-
        The add is planned against the invariants of the series (ADR-057):
        inside the presence, no overlap, no gap. The one automatic consequence
        is closing the assignment in force on the new start date the day
        before it. An assignment that starts on the start date of an existing
        one is not an add: it is rejected as WORK_CENTER_IS_A_CORRECTION,
        naming the assignment it would correct, and has to be asked for as a
        correction (PUT).
      tags:
        - Employee Work Center
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - in: path
          name: ruleSystemCode
          required: true
          schema:
            type: string
            maxLength: 5
        - in: path
          name: employeeTypeCode
          required: true
          schema:
            type: string
            maxLength: 30
        - in: path
          name: employeeNumber
          required: true
          schema:
            type: string
            maxLength: 15
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeCreateWorkCenterRequest"
      responses:
        "201":
          description: Work center assignment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeWorkCenterAssignmentResponse"
        "400":
          description: Invalid request
        "404":
          description: Rule system, employee, or catalog not found
        "409":
          description: >-
            The resulting series would break an invariant (ADR-057):
            WORK_CENTER_OVERLAP (details.overlaps), WORK_CENTER_COVERAGE_GAP
            (details.gaps and details.stretchCandidates name the gap and the
            neighbour to stretch), WORK_CENTER_OUTSIDE_PRESENCE,
            WORK_CENTER_IS_A_CORRECTION (details.correctedOccurrence names the
            assignment the add would correct), or WORK_CENTER_COMPANY_MISMATCH.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeWorkCenterErrorResponse"
    get:
      operationId: listEmployeeWorkCentersByBusinessKey
      summary: List employee work center assignments by business key
      tags:
        - Employee Work Center
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - in: path
          name: ruleSystemCode
          required: true
          schema:
            type: string
            maxLength: 5
        - in: path
          name: employeeTypeCode
          required: true
          schema:
            type: string
            maxLength: 30
        - in: path
          name: employeeNumber
          required: true
          schema:
            type: string
            maxLength: 15
      responses:
        "200":
          description: Work center assignment list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmployeeWorkCenterAssignmentResponse"
        "404":
          description: Rule system or employee not found

  /employees/{ruleSystemCode}/{employeeTypeCode}/{employeeNumber}/work-centers/plan:
    post:
      operationId: planWorkCenterChangeByBusinessKey
      summary: Plan a change to the work center series without applying it
      description: >-
        Answers what adding, removing or correcting a work center assignment
        would do to the series (ADR-057): what would be closed or reopened,
        what gap or overlap would appear, and the series as it would be.
        Nothing is written. A rejected plan is still a 200: the rejection and
        its reasons are in the body, so the screen can show them before the
        user confirms. An ADD on the start date of an existing assignment
        comes back as a CORRECT of that assignment, rejected as
        IS_A_CORRECTION.
      tags:
        - Employee Work Center
      parameters:
        - in: path
          name: ruleSystemCode
          required: true
          schema:
            type: string
            maxLength: 5
        - in: path
          name: employeeTypeCode
          required: true
          schema:
            type: string
            maxLength: 30
        - in: path
          name: employeeNumber
          required: true
          schema:
            type: string
            maxLength: 15
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanWorkCenterChangeRequest"
      responses:
        "200":
          description: The plan, accepted or rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeWorkCenterPlanResponse"
        "400":
          description: Invalid request
        "404":
          description: Employee or work center assignment not found

  /employees/{ruleSystemCode}/{employeeTypeCode}/{employeeNumber}/work-centers/{workCenterAssignmentNumber}:
    get:
      operationId: getWorkCenterByBusinessKey
      summary: Get employee work center assignment by business key
      tags:
        - Employee Work Center
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - in: path
          name: ruleSystemCode
          required: true
          schema:
            type: string
            maxLength: 5
        - in: path
          name: employeeTypeCode
          required: true
          schema:
            type: string
            maxLength: 30
        - in: path
          name: employeeNumber
          required: true
          schema:
            type: string
            maxLength: 15
        - in: path
          name: workCenterAssignmentNumber
          required: true
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: Work center assignment found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeWorkCenterAssignmentResponse"
        "404":
          description: Rule system, employee, or work center assignment not found
    put:
      operationId: updateWorkCenterByBusinessKey
      summary: Correct employee work center assignment by business key
      tags:
        - Employee Work Center
      description: >-
        Administrative correction of an existing work center assignment occurrence.
        This operation corrects assignment content and dates for the same occurrence
        identified by business keys and does not represent a workflow transition.
        Nothing else moves (ADR-057): stretching or shrinking a neighbour is a
        separate correction of that neighbour.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - in: path
          name: ruleSystemCode
          required: true
          schema:
            type: string
            maxLength: 5
        - in: path
          name: employeeTypeCode
          required: true
          schema:
            type: string
            maxLength: 30
        - in: path
          name: employeeNumber
          required: true
          schema:
            type: string
            maxLength: 15
        - in: path
          name: workCenterAssignmentNumber
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeUpdateWorkCenterRequest"
      responses:
        "200":
          description: Work center assignment corrected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeWorkCenterAssignmentResponse"
        "400":
          description: Invalid request
        "404":
          description: Rule system, employee, or work center assignment not found
        "409":
          description: >-
            The corrected dates would break an invariant (ADR-057):
            WORK_CENTER_OVERLAP (details.overlaps), WORK_CENTER_COVERAGE_GAP
            (details.gaps and details.stretchCandidates name the gap and the
            neighbour to stretch) or WORK_CENTER_OUTSIDE_PRESENCE; or the
            request is invalid by dates (WORK_CENTER_INVALID_PERIOD).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeWorkCenterErrorResponse"
    delete:
      operationId: deleteWorkCenterByBusinessKey
      summary: Delete employee work center assignment by business key
      tags:
        - Employee Work Center
      description: >-
        Removes a work center assignment, bounded by the invariants of the
        series (ADR-057 §3). Removing the last one reopens the previous one,
        up to where the removed one ended. Removing one in the middle would
        leave a stretch of the presence uncovered and is rejected as
        WORK_CENTER_COVERAGE_GAP, naming the gap and the neighbours the user
        could stretch first. The assignment that starts a presence is one
        such case: it never goes without leaving a gap.
      parameters:
        - in: path
          name: ruleSystemCode
          required: true
          schema:
            type: string
            maxLength: 5
        - in: path
          name: employeeTypeCode
          required: true
          schema:
            type: string
            maxLength: 30
        - in: path
          name: employeeNumber
          required: true
          schema:
            type: string
            maxLength: 15
        - in: path
          name: workCenterAssignmentNumber
          required: true
          schema:
            type: integer
            format: int32
      responses:
        "204":
          description: Work center assignment deleted
        "404":
          description: Rule system, employee, or work center assignment not found
        "409":
          description: >-
            WORK_CENTER_COVERAGE_GAP: removing it would leave a stretch of the
            presence without a work center; details.gaps names it and
            details.stretchCandidates the neighbours the user could stretch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeWorkCenterErrorResponse"

