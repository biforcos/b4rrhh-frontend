            schema:
              $ref: "#/components/schemas/CreateRuleEntityRequest"
      responses:
        "201":
          description: Rule entity created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleEntityResponse"
        "400":
          description: |
            The rule system or the rule entity type does not exist, the business key is already
            taken, or the type declares required extensions and is therefore maintained by its
            own endpoint (backend#88). In that last case the message names the collection to use.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleEntityErrorResponse"
    get:
      operationId: listRuleEntities
      summary: List or retrieve rule entities by business filters
      tags:
        - Rule Entities
      description: |
        Canonical retrieval is query-based using business keys.
        Supported canonical combinations include:
        - `ruleSystemCode`
        - `ruleSystemCode + ruleEntityTypeCode`
        - `ruleSystemCode + ruleEntityTypeCode + code`
      parameters:
        - in: query
          name: ruleSystemCode
          required: false
          schema:
            type: string
            maxLength: 5
        - in: query
          name: ruleEntityTypeCode
          required: false
          schema:
            type: string
            maxLength: 30
        - in: query
          name: code
          required: false
          schema:
            type: string
            maxLength: 50
        - in: query
          name: active
          required: false
          schema:
            type: boolean
        - in: query
          name: referenceDate
          required: false
          schema:
            type: string
            format: date
          description: Optional date used to return only occurrences valid on that day.
      responses:
        "200":
          description: Rule entities list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RuleEntityResponse"

  /rule-entities/{ruleSystemCode}/{ruleEntityTypeCode}/{code}/{startDate}:
    get:
      operationId: getRuleEntityByBusinessKey
      summary: Get rule entity occurrence by full business key
      tags:
        - Rule Entities
      description: Returns the exact occurrence identified by ruleSystemCode, ruleEntityTypeCode, code and startDate.
      parameters:
        - in: path
          name: ruleSystemCode
          required: true
          schema:
            type: string
            maxLength: 5
        - in: path
          name: ruleEntityTypeCode
          required: true
          schema:
            type: string
            maxLength: 30
        - in: path
          name: code
          required: true
          schema:
            type: string
            maxLength: 50
        - in: path
          name: startDate
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Rule entity occurrence found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleEntityResponse"
        "404":
          description: Rule entity occurrence not found
    put:
      operationId: correctRuleEntityByBusinessKey
      summary: Correct existing rule entity occurrence
      tags:
        - Rule Entities
      description: |
        Corrects mutable fields of the same occurrence identified by the full business key.
        Identity fields (ruleSystemCode, ruleEntityTypeCode, code, startDate) are immutable.
        This operation does not create a new occurrence.
      parameters:
        - in: path
          name: ruleSystemCode
          required: true
          schema:
            type: string
            maxLength: 5
        - in: path
          name: ruleEntityTypeCode
          required: true
          schema:
            type: string
            maxLength: 30
        - in: path
          name: code
          required: true
          schema:
            type: string
            maxLength: 50
        - in: path
          name: startDate
          required: true
          schema:
            type: string
            format: date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CorrectRuleEntityRequest"
      responses:
        "200":
          description: Rule entity occurrence corrected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleEntityResponse"
        "400":
          description: Invalid request payload
        "404":
          description: Rule entity occurrence not found
        "409":
          description: Domain conflict while correcting the occurrence
    delete:
      operationId: deleteRuleEntityByBusinessKey
      summary: Delete rule entity by functional business key
      tags:
        - Rule Entities
      description: |
        Delete is allowed only when the target rule entity exists and is not referenced by business resources.
        This operation is business-key only and does not use technical identifiers.
      parameters:
        - in: path
          name: ruleSystemCode
          required: true
          schema:
            type: string
            maxLength: 5
        - in: path
          name: ruleEntityTypeCode
          required: true
          schema:
            type: string
            maxLength: 30
        - in: path
          name: code
          required: true
          schema:
            type: string
            maxLength: 50
        - in: path
          name: startDate
          required: true
          schema:
            type: string
            format: date
      responses:
        "204":
          description: Rule entity deleted
        "404":
          description: Rule entity not found
        "409":
          description: Rule entity is in use and cannot be deleted

