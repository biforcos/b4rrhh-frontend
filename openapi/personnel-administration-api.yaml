            maxLength: 5
        - in: query
          name: ruleEntityTypeCode
          required: true
          schema:
            type: string
            maxLength: 30
        - in: query
          name: referenceDate
          required: false
          schema:
            type: string
            format: date
          description: Optional date used as effective date for validity filtering and item active evaluation.
        - in: query
          name: q
          required: false
          schema:
            type: string
            maxLength: 100
          description: Optional case-insensitive search by option code or name.
      responses:
        "200":
          description: Direct catalog options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectCatalogOptionsResponse"
        "400":
          description: Invalid request

