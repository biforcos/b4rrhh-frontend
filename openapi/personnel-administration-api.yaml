            - $ref: "#/components/schemas/EmployeeWorkCenterOccurrence"
        adjustedOccurrence:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/EmployeeWorkCenterPlanAdjustment"
        overlaps:
          type: array
          description: Dates two assignments would share.
          items:
            $ref: "#/components/schemas/EmployeeWorkCenterPeriod"
        gaps:
          type: array
          description: Stretches of the presence the resulting series would leave uncovered.
          items:
            $ref: "#/components/schemas/EmployeeWorkCenterPeriod"
        stretchCandidates:
          type: array
          description: The neighbours of the gaps, which the user could stretch. Named, never moved.
          items:
            $ref: "#/components/schemas/EmployeeWorkCenterOccurrence"
        projected:
          type: array
          description: The series as it would be, accepted or not.
