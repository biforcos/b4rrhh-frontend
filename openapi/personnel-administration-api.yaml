          type: string
          format: date
          nullable: true
          description: Optional end date (yyyy-MM-dd). Must be greater than or equal to startDate.
    UpdateContractRequest:
      type: object
      additionalProperties: false
      required:
        - startDate
        - contractCode
        - contractSubtypeCode
      properties:
        startDate:
          type: string
          format: date
          description: >-
            The start date the contract has after the correction (yyyy-MM-dd).
            Required: correcting without moving the start is said by repeating
            the startDate the path already carries. It used to be optional,
            and omitting it meant "keep the path startDate" — indistinguishable
            from a client that forgot to send it (backend#69). Nothing else
            moves (ADR-057): if the new start leaves a gap the predecessor is
            not stretched, the request is rejected and the error names it as
            the neighbour to stretch.
        endDate:
          type: string
          format: date
          nullable: true
          description: Corrected end date (yyyy-MM-dd). Omit it, or send null, for a contract that stays open.
        contractCode:
          type: string
          minLength: 3
          maxLength: 3
        contractSubtypeCode:
          type: string
          minLength: 3
          maxLength: 3
    ContractResponse:
      type: object
      required:
        - contractCode
        - contractSubtypeCode
        - startDate
      properties:
        contractCode:
          type: string
          minLength: 3
          maxLength: 3
        contractTypeName:
          type: string
          nullable: true
          description: Optional display name from CONTRACT rule entities in the employee ruleSystemCode catalog.
        contractSubtypeCode:
          type: string
          minLength: 3
          maxLength: 3
        contractSubtypeName:
          type: string
          nullable: true
          description: Optional display name from CONTRACT_SUBTYPE rule entities in the employee ruleSystemCode catalog.
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          nullable: true
    ContractPeriod:
      type: object
      description: >-
        A stretch of dates named by a plan or an error: a contract (identified
        by its start date), a gap, or an overlap.
      required:
        - startDate
      properties:
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          nullable: true
          description: Null means onwards.
    ContractErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - CONTRACT_NOT_FOUND
            - CONTRACT_EMPLOYEE_NOT_FOUND
            - CONTRACT_INVALID_REQUEST
            - CONTRACT_OVERLAP
            - CONTRACT_COVERAGE_GAP
            - CONTRACT_OUTSIDE_PRESENCE
            - CONTRACT_IS_A_CORRECTION
            - CONTRACT_ALREADY_CLOSED
        message:
          type: string
        details:
          type: object
          nullable: true
          description: >-
            What a plan rejection names (ADR-057). CONTRACT_OVERLAP carries
            overlaps (ContractPeriod[]); CONTRACT_COVERAGE_GAP carries gaps and
            stretchCandidates (ContractPeriod[] each); CONTRACT_IS_A_CORRECTION
            carries correctedOccurrence (ContractPeriod), the contract the add
            would correct. Null when the error has nothing to name.
          additionalProperties: true
    PlanContractChangeRequest:
      type: object
      additionalProperties: false
      required:
        - operation
      properties:
        operation:
          type: string
          enum: [ADD, REMOVE, CORRECT]
          description: >-
            ADD plans a new contract from startDate to endDate; REMOVE plans
            removing the contract that starts on contractStartDate; CORRECT
            plans giving that contract the dates startDate to endDate.
        contractStartDate:
          type: string
          format: date
          description: >-
            Identifies the contract to remove or correct: a contract is
            identified by the day it starts. Required for REMOVE and CORRECT.
        startDate:
          type: string
          format: date
          description: Required for ADD and CORRECT.
        endDate:
          type: string
          format: date
          nullable: true
          description: Omit it for a contract that stays open.
    ContractPlanAdjustment:
      type: object
      description: The one existing contract the plan would move on its own. Only its end date changes.
      required:
        - before
        - after
      properties:
        before:
          $ref: "#/components/schemas/ContractPeriod"
        after:
          $ref: "#/components/schemas/ContractPeriod"
    ContractPlanResponse:
      type: object
      required:
        - operation
        - accepted
        - occurrence
        - overlaps
        - gaps
        - stretchCandidates
        - projected
      properties:
        operation:
          type: string
          enum: [ADD, REMOVE, CORRECT]
        accepted:
          type: boolean
        rejection:
          type: string
          nullable: true
          enum: [OUTSIDE_PRESENCE, OVERLAP, GAP_NOT_ALLOWED, IS_A_CORRECTION]
          description: >-
            Why the plan cannot be applied. Null when accepted. IS_A_CORRECTION
            means the plan is not the operation it was asked for: an ADD whose
            start date is the start date of an existing contract is the
            correction of that one (named in correctedOccurrence) and has to be
            asked for as a CORRECT.
        occurrence:
          $ref: "#/components/schemas/ContractPeriod"
        correctedOccurrence:
          nullable: true
          description: >-
            On a correction, the contract as it stands today, the one
            occurrence replaces. Null on an add and on a removal.
          allOf:
            - $ref: "#/components/schemas/ContractPeriod"
        adjustedOccurrence:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ContractPlanAdjustment"
        overlaps:
          type: array
          description: Dates two contracts would share.
          items:
            $ref: "#/components/schemas/ContractPeriod"
        gaps:
          type: array
          description: Stretches of the presence the resulting series would leave uncovered.
          items:
            $ref: "#/components/schemas/ContractPeriod"
        stretchCandidates:
          type: array
          description: The neighbours of the gaps, which the user could stretch. Named, never moved.
          items:
            $ref: "#/components/schemas/ContractPeriod"
        projected:
          type: array
          description: The series as it would be, accepted or not.
          items:
            $ref: "#/components/schemas/ContractPeriod"
