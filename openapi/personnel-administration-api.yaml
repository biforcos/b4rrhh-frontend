          nullable: true
          example: null
        benefitEntitled:
          type: boolean
          description: >-
            Si la baja lleva derecho a prestacion economica (backend#129). Sin el, la baja quita dias
            igual y no paga prestacion ni cotiza.
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AbsenceErrorResponse:
