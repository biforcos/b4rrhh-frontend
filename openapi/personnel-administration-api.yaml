            application/json:
              schema:
                $ref: "#/components/schemas/ContractErrorResponse"
    delete:
      operationId: deleteContractByBusinessKey
      summary: Remove a contract
      description: >-
        Removing the last contract reopens the previous one up to where the
        removed one ended (ADR-057). Removing one in the middle would leave the
