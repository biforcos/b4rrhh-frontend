          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractResponse"
        "404":
          description: Employee or contract not found
    put:
      operationId: updateContractByBusinessKey
      summary: Correct a contract (codes and/or dates)
      description: >-
        Corrects the contract that starts on the path startDate. Nothing else
        moves (ADR-057): stretching or shrinking a neighbour is a separate,
        explicit correction, and a closed contract can be corrected too.
      tags:
        - Employee Contract
      parameters:
