  /payroll-engine/{ruleSystemCode}/graph:
    get:
      tags:
        - Payroll Engine
      summary: The whole concept graph of a rule system in one call
      operationId: getPayrollConceptGraph
      description: >-
        Concepts, operands and feed relations of a rule system, together.

        This exists because drawing the graph used to cost 1 + 2N calls: the concept list, then
        the operands and the feeds of each concept, one by one. Measured in the browser, 78 calls
        for the 38 concepts of ESP and 200 for a 99-concept catalogue, and 198 of those 200
        answered a list of between zero and two items. It grows with the concepts of the RULE
        SYSTEM, not of the payslip, so the simplest payslip pays the same as the most complex one
        - and this is the screen that opens right after someone asked "where does this number
        come from".

        The engine had already paid this bill on its own side: the execution metamodel is loaded
        once per run for exactly the same reason. This is the same N+1 on the other side of the
        contract.

        The per-concept endpoints stay, and are not deprecated: they are what the detail panel
        and the two PUTs work against. This one answers a different question - the whole graph at
        once - and a client drawing a graph should use it.
      security:
        - bearerAuth: []
      parameters:
        - name: ruleSystemCode
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayrollConceptGraphResponse'

