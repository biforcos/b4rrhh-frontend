    PayrollResponse:
      type: object
      required:
        - ruleSystemCode
        - employeeTypeCode
        - employeeNumber
        - payrollPeriodCode
        - payrollTypeCode
        - presenceNumber
        - status
        - calculatedAt
        - concepts
        - rulesChangedSinceCalculation
      properties:
        ruleSystemCode:
          type: string
        employeeTypeCode:
          type: string
        employeeNumber:
          type: string
        payrollPeriodCode:
          type: string
        payrollTypeCode:
          type: string
          enum: [NORMAL, EXTRA]
        presenceNumber:
          type: integer
          format: int32
        status:
          $ref: '#/components/schemas/PayrollStatus'
        calculatedAt:
          type: string
          format: date-time
        rulesChangedSinceCalculation:
          type: boolean
          description: >-
            True when the rules of this rule system were touched after this payroll was
            calculated. The payroll itself does not change: it is what the engine calculated and
            stays that way. This says it may no longer reflect the rules in force, so a screen can
            offer to recalculate instead of looking as if nothing had happened.


            It OVER-WARNS on purpose. The comparison is against the last change to the whole rule
            system, so a change to a concept this employee does not use raises it too. That is the
            safe direction — it never says fresh when it is stale — and it is why this must be
            worded as "may no longer reflect the current rules" and never as a statement of fact.
            Narrowing it would need to know which concepts reach which payroll, which is a
            different problem.


            It clears itself: recalculating moves calculatedAt past the change.
        runId:
          type: integer
          format: int64
          nullable: true
          description: >-
            Calculation run that produced this payroll. Null means no registered execution
            produced it. Nothing served today produces such a payroll: the ad-hoc recalculation
            opens a run of its own since b4rrhh/backend#99, and the temporary calculate stub was
            retired in b4rrhh/backend#90. It stays nullable for the rows written before those two,
            and a client must still handle null.
        concepts:
          type: array
          items:
            $ref: '#/components/schemas/PayrollConceptResponse'
        contextSnapshots:
          type: array
          items:
            $ref: '#/components/schemas/PayrollContextSnapshotResponse'
        companyProfile:
          $ref: '#/components/schemas/PayrollCompanyProfileResponse'
        employeeProfile:
          $ref: '#/components/schemas/PayrollEmployeeProfileResponse'
        agreementProfile:
          $ref: '#/components/schemas/PayrollAgreementProfileResponse'
        presenceStartDate:
          type: string
          format: date
        presenceEndDate:
          type: string
          format: date
        seniorityDate:
          type: string
          format: date
          nullable: true
          description: >-
            Seniority of the employee, as a date: the start of their earliest presence, gaps
            included, so a rehired employee keeps the seniority of the first hire. This is NOT
            presenceStartDate, which is the start of the presence this payroll belongs to; for a
            rehired employee the two differ. It is a date and not a duration on purpose: a
            duration depends on when you count up to, and the employee record counts to today
            while an April payslip has to count to April. Null on payrolls calculated before the
            snapshot carried it, and null means "not known": do not substitute presenceStartDate.
        workCenterCode:
          type: string
        workCenterName:
          type: string
        statusReasonCode:
          type: string
          nullable: true
          description: Why the result is in its current status. Null when nothing forced it.
        calculationEngineCode:
          type: string
          description: Engine that produced this payroll, as the run recorded it.
        calculationEngineVersion:
          type: string
        warnings:
          type: array
          description: >-
            Functional warnings attached to this payroll result. They are not the
            operational messages of the run: those are read from
            GET /payroll/calculation-runs/{runId}/messages.
          items:
            $ref: '#/components/schemas/PayrollWarningResponse'

