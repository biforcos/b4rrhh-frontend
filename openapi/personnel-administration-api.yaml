openapi: 3.0.3
info:
  title: B4RRHH Personnel Administration API
  version: 0.1.0

tags:
  - name: Employee Directory
    description: Employee directory queries and employee core administrative operations.
  - name: Employee Lifecycle
    description: Hire, rehire, and terminate lifecycle workflows.
  - name: Employee Journey
    description: Read-only employee journey and timeline views.
  - name: Employee Presence
    description: Employee presence occurrence management.
  - name: Employee Address
    description: Employee address occurrence management.
  - name: Employee Work Center
    description: Employee work center assignment management.
  - name: Employee Cost Center
    description: Employee cost center distribution management.
  - name: Employee Contract
    description: Employee contract occurrence management.
  - name: Employee Labor Classification
    description: Employee labor classification occurrence management.
  - name: Employee Identifier
    description: Employee identifier management.
  - name: Employee Contact
    description: Employee contact management.
  - name: Company
    description: Functional aggregated company resource backed by COMPANY rule entities and company_profile enrichment.
  - name: Company Profile
    description: Enriched company profile reads and updates backed by the COMPANY occurrence applicable on the current date.
  - name: Agreement
    description: Functional aggregated agreement resource backed by AGREEMENT rule entities and agreement_profile enrichment.
  - name: Agreement Profile
    description: Enriched agreement profile reads and updates backed by the AGREEMENT base entity with annual hours and labor terms.
  - name: Work Center
    description: Functional aggregated work center resource backed by WORK_CENTER rule entities and work_center_profile enrichment.
  - name: Work Center Contact
    description: Work center contact management anchored to the WORK_CENTER aggregated resource.
  - name: Catalogs
    description: Read-only catalog and catalog binding queries.
  - name: Rule Systems
    description: Rule system administration endpoints.
  - name: Rule Entity Types
    description: Rule entity type administration endpoints.
  - name: Rule Entities
    description: Rule entity administration endpoints.
  - name: Payroll Engine
    description: Payroll concept designer, operand/feed configuration, and assignment rule management.
  - name: Employee Payroll Input
    description: Per-employee payroll quantity inputs (overtime hours, transport units, etc.)
  - name: Payroll
    description: Payroll lifecycle operations — search, invalidate, validate, recalculate.
  - name: Payroll Calculation Run
    description: Launch and track bulk payroll calculation runs.
  - name: Employee Absences
    description: Employee absence occurrence management.

paths:
  /employees:
    get:
      operationId: listEmployees
      summary: List or search employees for directory reads
      tags:
        - Employee Directory
      parameters:
        - in: query
          name: q
          required: false
          schema:
            type: string
            maxLength: 100
          description: Free text search over employee number and name-related fields.
        - in: query
          name: ruleSystemCode
          required: false
          schema:
            type: string
            maxLength: 5
        - in: query
          name: employeeTypeCode
          required: false
          description: Optional in V1. Defaults to 'EMP' when not provided.
          schema:
            type: string
            maxLength: 30
        - in: query
          name: status
          required: false
          schema:
            type: string
            maxLength: 30
        - in: query
          name: size
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
          description: Page size limit. Defaults to 50.
        - in: query
          name: page
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
          description: Zero-based page index. Defaults to 0.
      responses:
        "200":
          description: One page of the employee directory, with the total that matches the filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeDirectoryPageResponse"
        "400":
          description: Invalid query parameters
    post:
      operationId: createEmployee
      summary: Create employee
      tags:
        - Employee Directory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEmployeeRequest"
      responses:
        "201":
          description: Employee created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeResponse"

  /employees/hire:
    post:
      operationId: hireEmployee
      summary: Hire employee lifecycle workflow
      tags:
        - Employee Lifecycle
      description: |
        Business-oriented workflow that creates an employee and their initial lifecycle state.
        This operation creates the employee core identity, their first presence,
        initial contract, initial labor classification, and initial work center assignment
        in a single transaction using a single hireDate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HireEmployeeRequest"
      responses:
        "201":
          description: Employee hired successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HireEmployeeResponse"
        "400":
          description: Invalid request payload.
        "404":
          description: Required catalog dependency not found (rule system, company, etc).
        "409":
          description: Employee already exists.
        "422":
          description: Business validation failed (invalid catalog relation or distribution).
        default:
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HireEmployeeErrorResponse"

  /employees/{ruleSystemCode}/{employeeTypeCode}/{employeeNumber}/terminate:
    post:
      operationId: terminateEmployee
      summary: Terminate employee lifecycle workflow
      tags:
        - Employee Lifecycle
      description: |
        Closes active presence, contract, labor classification, and work center in a single transaction
        using a single mandatory terminationDate.
      parameters:
        - in: path
          name: ruleSystemCode
          required: true
          schema:
            type: string
            maxLength: 5
        - in: path
          name: employeeTypeCode
          required: true
          schema:
            type: string
            maxLength: 30
        - in: path
          name: employeeNumber
          required: true
          schema:
            type: string
            maxLength: 15
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TerminateEmployeeRequest"
      responses:
        "200":
          description: Employee terminated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminateEmployeeResponse"
        "400":
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminateEmployeeErrorResponse"
        "404":
          description: Rule system, employee, or required dependency not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminateEmployeeErrorResponse"
        "409":
          description: Functional conflict (inconsistent active occurrences or invalid temporal coherence)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminateEmployeeErrorResponse"
        "422":
          description: Business validation failed (for example invalid exitReasonCode)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminateEmployeeErrorResponse"

  /employees/{ruleSystemCode}/{employeeTypeCode}/{employeeNumber}/rehire:
    post:
      operationId: rehireEmployee
      summary: Rehire employee lifecycle workflow
      tags:
        - Employee Lifecycle
      description: |
        Reopens employee lifecycle by creating a new active presence, contract,
        labor classification, and work center assignment with a single mandatory rehireDate.
        rehireDate must be strictly later than the endDate of the latest closed presence.
      parameters:
        - in: path
          name: ruleSystemCode
          required: true
          schema:
            type: string
            maxLength: 5
        - in: path
          name: employeeTypeCode
          required: true
          schema:
            type: string
            maxLength: 30
        - in: path
          name: employeeNumber
          required: true
          schema:
            type: string
            maxLength: 15
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RehireEmployeeRequest"
      responses:
        "201":
          description: Employee rehired and new active cycle created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RehireEmployeeResponse"
        "200":
          description: Idempotent replay resolved to existing equivalent active cycle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RehireEmployeeResponse"
        "400":
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RehireEmployeeErrorResponse"
        "404":
          description: Rule system, employee, or required dependency not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RehireEmployeeErrorResponse"
        "409":
          description: Functional conflict (active lifecycle not equivalent or invalid temporal coherence)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RehireEmployeeErrorResponse"
        "422":
          description: Business validation failed (invalid catalog value or dependent relation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RehireEmployeeErrorResponse"

  /employees/{ruleSystemCode}/{employeeTypeCode}/{employeeNumber}:
    get:
      operationId: getEmployeeByBusinessKey
      summary: Get employee by business key
      tags:
        - Employee Directory
      parameters:
        - in: path
          name: ruleSystemCode
          required: true
          schema:
            type: string
            maxLength: 5
        - in: path
          name: employeeTypeCode
          required: true
          schema:
            type: string
            maxLength: 30
        - in: path
          name: employeeNumber
          required: true
          schema:
            type: string
            maxLength: 15
      responses:
        "200":
          description: Employee found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeResponse"
        "404":
          description: Rule system or employee not found
    put:
      operationId: updateEmployeeByBusinessKey
      summary: Update employee core identity fields by business key
      tags:
        - Employee Directory
      parameters:
        - in: path
          name: ruleSystemCode
          required: true
          schema:
            type: string
            maxLength: 5
        - in: path
          name: employeeTypeCode
          required: true
          schema:
            type: string
            maxLength: 30
        - in: path
          name: employeeNumber
          required: true
          schema:
            type: string
            maxLength: 15
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEmployeeRequest"
      responses:
        "200":
          description: Employee updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeResponse"
        "400":
          description: Invalid request
        "404":
          description: Rule system or employee not found
    delete:
      operationId: deleteEmployeeByBusinessKey
      summary: Administrative delete employee by business key
      tags:
        - Employee Directory
      description: |
        Exceptional administrative operation to physically delete an employee.
        This operation is outside normal lifecycle workflows and does not replace terminate.
      parameters:
        - in: path
          name: ruleSystemCode
          required: true
          schema:
            type: string
            maxLength: 5
        - in: path
          name: employeeTypeCode
          required: true
          schema:
            type: string
            maxLength: 30
        - in: path
          name: employeeNumber
          required: true
          schema:
            type: string
            maxLength: 15
      responses:
        "204":
          description: Employee deleted successfully
        "404":
          description: Employee not found

  /employees/{ruleSystemCode}/{employeeTypeCode}/{employeeNumber}/journey:
    get:
      operationId: getEmployeeJourney
      summary: Get aggregated employee journey timeline (read-only view)
      tags:
        - Employee Journey
      description: |
        Read-only aggregated timeline view for frontend rendering.
        This endpoint does not mutate data and does not replace canonical write verticals.
      parameters:
        - in: path
          name: ruleSystemCode
          required: true
          schema:
            type: string
            maxLength: 5
        - in: path
          name: employeeTypeCode
          required: true
          schema:
            type: string
            maxLength: 30
        - in: path
          name: employeeNumber
          required: true
          schema:
            type: string
            maxLength: 15
      responses:
        "200":
          description: Frontend-friendly aggregated journey timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeJourneyTracksResponse"
        "400":
          description: Invalid business key input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyErrorResponse"
        "404":
          description: Employee not found for journey read model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyErrorResponse"

  /employees/{ruleSystemCode}/{employeeTypeCode}/{employeeNumber}/journey-v2:
    get:
      operationId: getEmployeeJourneyV2
      summary: Get employee journey timeline as chronological events (read-only view)
      tags:
        - Employee Journey
      description: |
        Read-only event-based timeline for employee lifecycle visualization.
        This endpoint does not mutate data and does not replace canonical write verticals.
      parameters:
        - in: path
          name: ruleSystemCode
          required: true
          schema:
            type: string
            maxLength: 5
        - in: path
          name: employeeTypeCode
          required: true
          schema:
            type: string
            maxLength: 30
        - in: path
          name: employeeNumber
          required: true
          schema:
            type: string
            maxLength: 15
      responses:
        "200":
          description: Event-based employee journey timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeJourneyResponse"
        "400":
          description: Invalid business key input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyErrorResponse"
        "404":
          description: Employee not found for journey read model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyErrorResponse"

  /employees/{ruleSystemCode}/{employeeTypeCode}/{employeeNumber}/presences:
    post:
      operationId: createPresenceByBusinessKey
      summary: Create employee presence by business key
      tags:
        - Employee Presence
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - in: path
          name: ruleSystemCode
          required: true
          schema:
            type: string
            maxLength: 5
        - in: path
          name: employeeTypeCode
          required: true
          schema:
            type: string
            maxLength: 30
        - in: path
          name: employeeNumber
          required: true
          schema:
            type: string
            maxLength: 15
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePresenceRequest"
      responses:
        "201":
          description: Presence created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresenceResponse"
        "400":
          description: Invalid request
        "404":
          description: Rule system, employee, or catalog not found
        "409":
          description: Presence business conflict
    get:
      operationId: listEmployeePresencesByBusinessKey
      summary: List employee presences by business key
      tags:
        - Employee Presence
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - in: path
          name: ruleSystemCode
          required: true
          schema:
            type: string
            maxLength: 5
        - in: path
          name: employeeTypeCode
          required: true
          schema:
            type: string
            maxLength: 30
        - in: path
          name: employeeNumber
          required: true
          schema:
            type: string
            maxLength: 15
      responses:
        "200":
          description: Presence list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PresenceResponse"
        "404":
          description: Rule system or employee not found

  /employees/{ruleSystemCode}/{employeeTypeCode}/{employeeNumber}/presences/{presenceNumber}:
    get:
      operationId: getPresenceByBusinessKey
      summary: Get employee presence by business key
      tags:
        - Employee Presence
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - in: path
          name: ruleSystemCode
          required: true
          schema:
            type: string
            maxLength: 5
        - in: path
          name: employeeTypeCode
          required: true
          schema:
            type: string
            maxLength: 30
        - in: path
          name: employeeNumber
          required: true
          schema:
            type: string
            maxLength: 15
        - in: path
          name: presenceNumber
          required: true
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: Presence found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresenceResponse"
        "404":
          description: Rule system, employee, or presence not found

  /employees/{ruleSystemCode}/{employeeTypeCode}/{employeeNumber}/presences/{presenceNumber}/close:
    post:
      operationId: closePresenceByBusinessKey
      summary: Close employee presence by business key
      tags:
        - Employee Presence
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - in: path
          name: ruleSystemCode
          required: true
          schema:
            type: string
            maxLength: 5
        - in: path
          name: employeeTypeCode
          required: true
          schema:
            type: string
            maxLength: 30
        - in: path
          name: employeeNumber
          required: true
          schema:
            type: string
            maxLength: 15
        - in: path
          name: presenceNumber
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClosePresenceRequest"
      responses:
        "200":
          description: Presence closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresenceResponse"
        "400":
          description: Invalid request
        "404":
          description: Rule system, employee, or presence not found
        "409":
          description: Presence already closed

  /employees/{ruleSystemCode}/{employeeTypeCode}/{employeeNumber}/addresses:
    post:
      operationId: createAddressByBusinessKey
      summary: Create employee address by business key
      tags:
        - Employee Address
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - in: path
          name: ruleSystemCode
          required: true
          schema:
            type: string
            maxLength: 5
        - in: path
          name: employeeTypeCode
          required: true
          schema:
            type: string
            maxLength: 30
        - in: path
          name: employeeNumber
          required: true
          schema:
            type: string
            maxLength: 15
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAddressRequest"
      responses:
        "201":
          description: >-
            Address added to the series of its type (ADR-057). Addresses form one
            series per employee and address type: the domicile, the fiscal address
            and the mailing address live side by side. If an address of the same
            type was in force on the new start date it has been closed the day
            before: that is the only automatic consequence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressResponse"
        "400":
          description: Invalid request
        "404":
          description: Rule system, employee, or catalog not found
        "409":
          description: >-
            The resulting series of that type would break an invariant (ADR-057).
            Error codes: ADDRESS_OVERLAP (details.overlaps names the dates shared
            with another address of the same type), ADDRESS_COVERAGE_GAP (the type
            is the domicile and details.gaps names the uncovered stretches of the
            presence, details.stretchCandidates the neighbouring addresses the user
            could stretch), ADDRESS_IS_A_CORRECTION (the new address starts on the
            start date of an existing one of the same type, named in
            details.correctedOccurrence: it would correct that one, not add a
            second one, and has to be asked for as a correction), or
            ADDRESS_TYPE_COVERAGE_NOT_DECLARED (the catalog does not say whether
            the type is mandatory or optional).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressErrorResponse"
    get:
      operationId: listEmployeeAddressesByBusinessKey
      summary: List employee addresses by business key
      tags:
        - Employee Address
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - in: path
          name: ruleSystemCode
          required: true
          schema:
            type: string
            maxLength: 5
        - in: path
          name: employeeTypeCode
          required: true
          schema:
            type: string
            maxLength: 30
        - in: path
          name: employeeNumber
          required: true
          schema:
            type: string
            maxLength: 15
      responses:
        "200":
          description: Address list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AddressResponse"
        "404":
          description: Rule system or employee not found

  /employees/{ruleSystemCode}/{employeeTypeCode}/{employeeNumber}/addresses/{addressNumber}:
    get:
      operationId: getAddressByBusinessKey
      summary: Get employee address by business key
      tags:
        - Employee Address
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - in: path
          name: ruleSystemCode
          required: true
          schema:
            type: string
            maxLength: 5
        - in: path
          name: employeeTypeCode
          required: true
          schema:
            type: string
            maxLength: 30
        - in: path
          name: employeeNumber
          required: true
          schema:
            type: string
            maxLength: 15
        - in: path
          name: addressNumber
          required: true
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: Address found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressResponse"
        "404":
          description: Rule system, employee, or address not found
    put:
      operationId: updateAddressByBusinessKey
      summary: Correct employee address by business key (fields and/or dates)
      tags:
        - Employee Address
      description: >-
        Administrative correction of the same address occurrence identified by
        ruleSystemCode, employeeTypeCode, employeeNumber, and addressNumber.
        This operation does not create a new occurrence and never changes the
        address type, which names the series the occurrence belongs to. The
        dates can be corrected too (ADR-057, decision 3): nothing else moves,
        and the corrected dates are judged against the same invariants as an
        add. Omit startDate to leave the dates as they are.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - in: path
          name: ruleSystemCode
          required: true
          schema:
            type: string
            maxLength: 5
        - in: path
          name: employeeTypeCode
          required: true
          schema:
            type: string
            maxLength: 30
        - in: path
          name: employeeNumber
          required: true
          schema:
            type: string
            maxLength: 15
        - in: path
          name: addressNumber
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAddressRequest"
      responses:
        "200":
          description: >-
            Address corrected. Nothing else moves (ADR-057): stretching or
            shrinking a neighbour is a separate, explicit correction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressResponse"
        "400":
          description: Invalid request
        "404":
          description: Rule system, employee, or address not found
        "409":
          description: >-
            The corrected dates would break an invariant of the series of that
            type (ADR-057): ADDRESS_OVERLAP, or ADDRESS_COVERAGE_GAP when the
            type is the domicile (details name the gap and the neighbour to
            stretch).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressErrorResponse"
    delete:
      operationId: deleteAddressByBusinessKey
      summary: Remove an address
      description: >-
        Removing the last address of its type reopens the previous one of the
        same type up to where the removed one ended (ADR-057). Removing one in
        the middle of the domicile would leave the presence uncovered and is
        rejected: the error names the neighbours the user could stretch first.
        In an optional type the gap is legal and the removal is accepted.
      tags:
        - Employee Address
      parameters:
        - in: path
          name: ruleSystemCode
          required: true
          schema:
            type: string
            maxLength: 5
        - in: path
          name: employeeTypeCode
          required: true
          schema:
            type: string
            maxLength: 30
        - in: path
          name: employeeNumber
          required: true
          schema:
            type: string
            maxLength: 15
        - in: path
          name: addressNumber
          required: true
          schema:
            type: integer
            format: int32
      responses:
        "204":
          description: Address removed
        "404":
          description: Rule system, employee, or address not found
        "409":
          description: >-
            ADDRESS_COVERAGE_GAP: removing it would leave the presence without a
            domicile; details.gaps and details.stretchCandidates say where and
            what to stretch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressErrorResponse"

  /employees/{ruleSystemCode}/{employeeTypeCode}/{employeeNumber}/addresses/plan:
    post:
      operationId: planAddressChangeByBusinessKey
      summary: Plan a change to an address series without applying it
      description: >-
        Answers what adding, removing or correcting an address would do to the
        series of its type (ADR-057): what would be closed or reopened, what gap
        or overlap would appear, and the series as it would be. Nothing is
        written. A rejected plan is still a 200: the rejection and its reasons
        are in the body, so the screen can show them before the user confirms.
        An ADD names the series by addressTypeCode; a REMOVE or a CORRECT takes
        it from the address they are about.
      tags:
        - Employee Address
      parameters:
        - in: path
          name: ruleSystemCode
          required: true
          schema:
            type: string
            maxLength: 5
        - in: path
          name: employeeTypeCode
          required: true
          schema:
            type: string
            maxLength: 30
        - in: path
          name: employeeNumber
          required: true
          schema:
            type: string
            maxLength: 15
