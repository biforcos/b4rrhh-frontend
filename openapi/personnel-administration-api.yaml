      parameters:
        - name: ruleSystemCode
          in: path
          required: true
          schema:
            type: string
        - name: tableCode
          in: path
          required: true
          schema:
            type: string
        - name: rowId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Row deleted
        "404":
          description: Row not found

components:
  parameters:
    AcceptLanguage:
      in: header
      name: Accept-Language
      required: false
      description: >-
        Language of the catalog labels in the response (ADR-052). Short BCP 47 tag such as
        `es-ES`, `fr-FR` or `en`; the heaviest language of the header is used. Codes never
        change. A label without a translation for that language, a missing header or an
        unrecognised one all fall back to the base literal, silently.
      schema:
        type: string
        example: es-ES
  schemas:
