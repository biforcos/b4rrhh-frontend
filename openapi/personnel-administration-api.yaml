      properties:
        startDate:
          type: string
          format: date
          description: Start date of the working time period (yyyy-MM-dd).
        endDate:
          type: string
          format: date
          nullable: true
          description: >-
            End date of the working time period (yyyy-MM-dd). Omit it for a
            working time that is still in force.
        workingTimePercentage:
          type: number
          format: double
          description: Percentage from > 0 to <= 100. Source of truth for derived persisted hours.
    UpdateWorkingTimeRequest:
      type: object
      additionalProperties: false
      required:
        - startDate
        - workingTimePercentage
      properties:
        startDate:
          type: string
          format: date
          description: >-
            The start date the working time has after the correction
            (yyyy-MM-dd). Required, like in every temporal series
            (backend#69): correcting without moving the start is said by
            repeating the date it already has. No neighbour is adjusted: if
            the new dates leave a gap or an overlap the correction is rejected
            and the error names what to stretch.
        endDate:
          type: string
          format: date
          nullable: true
          description: Corrected end date (yyyy-MM-dd). Omit it, or send null, to leave the working time open.
        workingTimePercentage:
          type: number
          format: double
          description: "Percentage from > 0 to <= 100. Source of truth for derived persisted hours."
          minimum: 0.01
          maximum: 100
    PlanWorkingTimeChangeRequest:
      type: object
      additionalProperties: false
      required:
        - operation
      properties:
        operation:
          type: string
          enum: [ADD, REMOVE, CORRECT]
          description: >-
            ADD plans a new working time from startDate to endDate; REMOVE plans
            removing workingTimeNumber; CORRECT plans giving workingTimeNumber
            the dates startDate to endDate.
        workingTimeNumber:
          type: integer
          format: int32
          description: Required for REMOVE and CORRECT.
        startDate:
          type: string
          format: date
          description: Required for ADD and CORRECT.
        endDate:
          type: string
          format: date
          nullable: true
