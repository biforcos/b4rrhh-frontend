  /employees/{ruleSystemCode}/{employeeTypeCode}/{employeeNumber}/cost-centers/distributions:
    post:
      operationId: createCostCenterDistribution
      summary: Create a new cost center distribution window
      tags:
        - Employee Cost Center
      description: |
        Adds a distribution window from startDate to endDate (open when omitted).
        The occurrence is the window, the set of lines that share a start date, and
        the series is judged by its invariants (ADR-057): the window in force on
        startDate is closed the day before, every line of it; an overlap, a gap
        inside the presence (coverage is mandatory) or a window outside the
        presence is rejected naming what it ran into. Starting on the start date of
        an existing window is not an add: it is rejected as COST_CENTER_IS_A_CORRECTION,
        naming the window to correct with PUT.
        All items share the same dates. Sum of allocationPercentage must be <= 100.
      parameters:
        - in: path
          name: ruleSystemCode
          required: true
          schema:
            type: string
            maxLength: 5
        - in: path
          name: employeeTypeCode
          required: true
          schema:
            type: string
            maxLength: 30
        - in: path
          name: employeeNumber
          required: true
          schema:
            type: string
            maxLength: 15
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCostCenterDistributionRequest"
      responses:
        "201":
          description: Distribution window created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostCenterDistributionWindowResponse"
        "400":
          description: Invalid request (invalid item, sum > 100, missing fields, unknown catalog value)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostCenterErrorResponse"
        "404":
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostCenterErrorResponse"
        "409":
          description: >-
            The resulting series would break an invariant (ADR-057):
            COST_CENTER_OVERLAP (details.overlaps), COST_CENTER_OUTSIDE_PRESENCE,
            or COST_CENTER_IS_A_CORRECTION (details.correctedOccurrence names the
            window the add would correct). A gap the add leaves is not an
            error: the series declares optional coverage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostCenterErrorResponse"

  /employees/{ruleSystemCode}/{employeeTypeCode}/{employeeNumber}/cost-centers/plan:
    post:
      operationId: planCostCenterDistributionChange
      summary: Plan a change to the cost center series without applying it
      description: >-
        Answers what adding, removing or correcting a distribution window would
        do to the series (ADR-057): what would be closed or reopened, what gap
        or overlap would appear, and the series as it would be. Nothing is
        written. A rejected plan is still a 200: the rejection and its reasons
        are in the body, so the screen can show them before the user confirms.
        An ADD on the start date of an existing window comes back as a CORRECT
        of that window, rejected as IS_A_CORRECTION. Windows are named by their
        dates: the occurrence is the window, not the line.
      tags:
        - Employee Cost Center
      parameters:
        - in: path
          name: ruleSystemCode
          required: true
          schema:
            type: string
            maxLength: 5
        - in: path
          name: employeeTypeCode
          required: true
          schema:
            type: string
            maxLength: 30
        - in: path
          name: employeeNumber
          required: true
          schema:
            type: string
            maxLength: 15
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanCostCenterDistributionChangeRequest"
      responses:
        "200":
          description: The plan, accepted or rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostCenterDistributionPlanResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostCenterErrorResponse"
        "404":
          description: Employee or distribution window not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostCenterErrorResponse"

  /employees/{ruleSystemCode}/{employeeTypeCode}/{employeeNumber}/cost-centers/distributions/{startDate}:
    put:
      operationId: updateCostCenterDistribution
      summary: Correct the cost center distribution window identified by startDate
      tags:
        - Employee Cost Center
      description: >-
        Administrative correction of a distribution window (ADR-057, decision 3).
        Correcting a line is correcting the set: the window is replaced whole
        with the items given. Omit startDate in the body to keep the dates the
        window has and fix only its lines, without inventing a change in the
        history. Give startDate (and endDate, omitted for a window that stays
        open) to move the window; the corrected dates are judged by the same
        invariants as an add and nothing else moves.
      parameters:
        - in: path
          name: ruleSystemCode
          required: true
          schema:
            type: string
            maxLength: 5
        - in: path
          name: employeeTypeCode
          required: true
          schema:
            type: string
            maxLength: 30
        - in: path
          name: employeeNumber
          required: true
          schema:
            type: string
            maxLength: 15
        - in: path
          name: startDate
          required: true
          schema:
            type: string
            format: date
          description: The startDate that identifies the distribution window to correct.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCostCenterDistributionRequest"
      responses:
        "200":
          description: Distribution window corrected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostCenterDistributionWindowResponse"
        "400":
          description: Invalid request (invalid item, sum > 100, missing fields, unknown catalog value)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostCenterErrorResponse"
        "404":
          description: Employee or distribution window not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostCenterErrorResponse"
        "409":
          description: >-
            The corrected dates would break an invariant (ADR-057):
            COST_CENTER_OVERLAP (details.overlaps) or COST_CENTER_OUTSIDE_PRESENCE.
            A gap the corrected dates leave is not an error: the series
            declares optional coverage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostCenterErrorResponse"
    delete:
      operationId: deleteCostCenterDistribution
      summary: Delete the cost center distribution window identified by startDate
      tags:
        - Employee Cost Center
      description: >-
        Removes a distribution window, every line of it (ADR-057 §3).
        Removing the last one reopens the previous one, up to where the
        removed one ended. Removing one in the middle leaves a stretch of the
        presence without a distribution, and that is accepted: the series
        declares optional coverage, so the gap is a legal state and nothing
        else moves. Ask POST /plan first to see the gap it would leave.
      parameters:
        - in: path
          name: ruleSystemCode
          required: true
          schema:
            type: string
            maxLength: 5
        - in: path
          name: employeeTypeCode
          required: true
