  /rule-entity-translations/coverage:
    get:
      operationId: getRuleEntityTranslationCoverage
      summary: Translation coverage of rule entity labels for one language
      description: >-
        Administration report (ADR-052). For every rule entity type, how many codes have a
        translation in the given language, how many do not, and which ones are missing.
        Responses never mark which labels are translated; this report is where the gaps show.
      tags:
        - Rule Entity Translations
      parameters:
        - in: query
          name: languageCode
          required: true
          description: Short BCP 47 tag (es-ES, fr-FR, en).
          schema:
            type: string
            maxLength: 5
            example: es-ES
      responses:
        "200":
          description: Coverage report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleEntityTranslationCoverageResponse"
        "400":
          description: languageCode is not a short BCP 47 tag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleEntityTranslationErrorResponse"
        "403":
          description: Requires the ADMIN role

