          required: true
          schema:
            type: string
            format: date
      responses:
        "204":
          description: Contract removed
        "404":
          description: Employee or contract not found
        "409":
          description: >-
            CONTRACT_COVERAGE_GAP: removing it would leave the presence
            uncovered; details.gaps and details.stretchCandidates say where and
            what to stretch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractErrorResponse"

