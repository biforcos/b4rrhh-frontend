        employeeNumber:
          type: string
        payrollPeriodCode:
          type: string
        payrollTypeCode:
          type: string
          enum: [NORMAL, EXTRA]
        presenceNumber:
          type: integer
        status:
          type: string
          enum: [NOT_VALID, CALCULATED, EXPLICIT_VALIDATED, DEFINITIVE]
        calculatedAt:
          type: string
          format: date-time
    PayrollErrorResponse:
      type: object
      required:
        - message
      properties:
        code:
          type: string
          description: >-
            Run message code for the failure, when it has one. Present on 422; absent on the
            errors that predate it (404, 409), whose body is unchanged.
          example: UNIT_CALCULATION_ERROR
        message:
          type: string
        details:
          type: object
          additionalProperties: true
          description: What the bulk launch stores in the run message details for the same failure.

    CreatePayrollConceptRequest:
      type: object
      required: [conceptCode, conceptMnemonic, calculationType, functionalNature, executionScope]
      properties:
        conceptCode:
          type: string
          example: "201"
        conceptMnemonic:
          type: string
          example: "PLUS_TRANSPORTE"
        calculationType:
          type: string
          enum: [DIRECT_AMOUNT, RATE_BY_QUANTITY, PERCENTAGE, AGGREGATE, JAVA_PROVIDED, EMPLOYEE_INPUT]
        functionalNature:
          type: string
          enum: [EARNING, DEDUCTION, BASE, INFORMATIONAL, TECHNICAL, TOTAL_EARNING, TOTAL_DEDUCTION, TOTAL_EMPLOYER_CONTRIBUTION, NET_PAY]
        executionScope:
          type: string
          enum: [SEGMENT, PERIOD]
        payslipOrderCode:
          type: string
          nullable: true
        summary:
          type: string
          nullable: true

    PayrollConceptDesignerResponse:
      type: object
      description: >-
        An engine concept. conceptMnemonic and label are two different things and both are here.
        The mnemonic is the IDENTIFIER: it is what rules reference to find the concept, and it is
        what the graph and the calculation trace key on. The label is what the concept is called.
        A client must never show one in place of the other.
      required: [ruleSystemCode, conceptCode, conceptMnemonic, calculationType, functionalNature, executionScope]
      properties:
        ruleSystemCode:
          type: string
        conceptCode:
          type: string
        conceptMnemonic:
          type: string
        label:
          type: string
          nullable: true
          example: "Salario base"
          description: >-
            What this concept is called, in the single language the engine resolves today. Null
            when the concept has no name yet, which happens whenever someone adds a concept and
            forgets the literal. A client showing this must fall back to conceptMnemonic rather
            than paint a gap: a visible absence is better than an invisible one.
        calculationType:
          type: string
        functionalNature:
          type: string
        executionScope:
          type: string
        payslipOrderCode:
          type: string
          nullable: true
        summary:
          type: string
          nullable: true

    UpdateConceptSummaryRequest:
      type: object
      properties:
        summary:
          type: string
          nullable: true

    PayslipSectionResponse:
      type: object
      description: >-
        One block of the official payslip model. A payslip line belongs to it through its
        conceptNatureCode, not through its concept code.
      required: [sectionCode, label, displayOrder]
      properties:
        sectionCode:
          type: string
          example: "DEVENGOS"
        label:
          type: string
          example: "Devengos"
        displayOrder:
          type: integer
          format: int32
          description: >-
            Where this block goes relative to the others. Order the blocks by this, and the lines
            inside each block by their own displayOrder.
        subsections:
          type: array
          description: >-
            The parts this block is divided into, in print order. Empty in four of the five
            blocks of the official model, which is the normal case: earnings print as one list.
            The contribution-bases box has four numbered parts, and a line lands in one of them
            through its payslipSubsectionCode.
          items:
            $ref: '#/components/schemas/PayslipSubsectionResponse'

    PayslipSubsectionResponse:
      type: object
      description: >-
        One part of a payslip block. Which part a line belongs to is declared by its concept and
        does not follow from its nature: the ten lines of the contribution-bases box are all
        BASE and live in four different parts.
      required: [subsectionCode, label, displayOrder]
      properties:
        subsectionCode:
          type: string
          example: "BASE_CC"
        label:
          type: string
          example: "1. Contingencias comunes"
        displayOrder:
          type: integer
          format: int32
          description: Where this part goes inside its block.

    UpdateConceptLabelRequest:
      type: object
      required: [label]
      properties:
        label:
          type: string
          maxLength: 200
          example: "Salario base"
          description: >-
            What the concept is called. Required and not blank: a blank literal is not "no name",
            it is a gap. Changing it does NOT move any payroll already calculated — each payslip
            line froze its literal when it was calculated — it changes what the next calculation
            will say.

    UpdateConceptOperandsRequest:
      type: object
      required: [operands]
      properties:
        operands:
          type: array
          items:
            type: object
            required: [operandRole, sourceObjectCode]
            properties:
              operandRole:
                type: string
                enum: [QUANTITY, RATE, BASE, PERCENTAGE]
              sourceObjectCode:
                type: string

    UpdateConceptFeedsRequest:
      type: object
      required: [feeds]
      properties:
        feeds:
          type: array
          items:
            type: object
            required: [sourceObjectCode, invertSign, effectiveFrom]
            properties:
              sourceObjectCode:
                type: string
              invertSign:
                type: boolean
              effectiveFrom:
                type: string
                format: date
              effectiveTo:
                type: string
                format: date
                nullable: true

    PayrollConceptGraphResponse:
      type: object
      description: >-
        The whole graph of a rule system: its concepts and every edge between them.

        Edges are flat and carry the concept they point AT, which is what the per-concept
        endpoints cannot say because there the target is in the path. Nothing here is grouped by
        concept on purpose: a client draws edges, not trees, and grouping would force it to
        flatten what the server had just nested.

        The three lists are read in one transaction, so they are consistent with each other: an
        operand never names a concept that is missing from concepts.
      required: [ruleSystemCode, concepts, operands, feeds]
      properties:
        ruleSystemCode:
          type: string
        concepts:
          type: array
          items:
            $ref: '#/components/schemas/PayrollConceptDesignerResponse'
        operands:
          type: array
          description: Every operand of every concept of the rule system, ordered by concept and role.
          items:
            $ref: '#/components/schemas/ConceptGraphOperandResponse'
        feeds:
          type: array
          description: >-
            Every feed relation of the rule system, ordered by target concept. Not filtered by
            date: the designer draws the wiring as it is declared, including what is not in force
            today, which is what the per-concept endpoint also returns.
          items:
            $ref: '#/components/schemas/ConceptGraphFeedResponse'

    ConceptGraphOperandResponse:
      type: object
      description: An operand edge, with the concept it feeds into.
      required: [conceptCode, operandRole, sourceObjectCode]
      properties:
        conceptCode:
          type: string
          description: The concept this operand belongs to - the target of the edge.
        operandRole:
          type: string
        sourceObjectCode:
          type: string

    ConceptGraphFeedResponse:
      type: object
      description: A feed edge, with the concept it feeds into.
      required: [conceptCode, sourceObjectCode, invertSign, effectiveFrom]
      properties:
        conceptCode:
          type: string
          description: The concept being fed - the target of the edge.
        sourceObjectCode:
          type: string
        invertSign:
          type: boolean
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: string
          format: date
          nullable: true

    ConceptOperandResponse:
      type: object
      required: [operandRole, sourceObjectCode]
      properties:
        operandRole:
          type: string
        sourceObjectCode:
          type: string

    ConceptFeedResponse:
      type: object
      required: [sourceObjectCode, invertSign, effectiveFrom]
      properties:
        sourceObjectCode:
          type: string
        invertSign:
          type: boolean
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: string
          format: date
          nullable: true

    PayrollConceptErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: "PayrollConcept not found: ruleSystemCode=ESP, conceptCode=NO_EXISTE"

