          type: string
          maxLength: 300
        city:
          type: string
          maxLength: 120
        countryCode:
          type: string
          maxLength: 3
          description: ISO 3166-1 alpha-3 code validated against active COUNTRY rule entities for the employee ruleSystemCode.
        postalCode:
          type: string
          maxLength: 20
          nullable: true
        regionCode:
          type: string
          maxLength: 30
          nullable: true
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          nullable: true
    UpdateAddressRequest:
      type: object
      additionalProperties: false
      required:
        - street
        - city
        - countryCode
        - startDate
      properties:
        street:
          type: string
          maxLength: 300
        city:
          type: string
          maxLength: 120
        countryCode:
          type: string
          maxLength: 3
          description: ISO 3166-1 alpha-3 code validated against active COUNTRY rule entities for the employee ruleSystemCode.
        postalCode:
          type: string
          maxLength: 20
          nullable: true
        regionCode:
          type: string
          maxLength: 30
          nullable: true
        startDate:
          type: string
          format: date
          description: >-
            The start date the address has after the correction. Required: the
            correction always says where the address starts, even when it does
            not move, and repeating the date it already has is how that is
            said. It used to be optional, and omitting it meant "leave the
            dates as they are" — which is indistinguishable from a client that
            forgot to send it, and ate three screens' edits in silence
            (backend#69).
        endDate:
          type: string
          format: date
          nullable: true
          description: The corrected end date. Omit it, or send null, for an address that stays open.
    AddressErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: >-
            ADDRESS_NOT_FOUND, ADDRESS_INVALID_REQUEST, ADDRESS_ALREADY_CLOSED,
            ADDRESS_OVERLAP, ADDRESS_COVERAGE_GAP, ADDRESS_IS_A_CORRECTION or
            ADDRESS_TYPE_COVERAGE_NOT_DECLARED.
        message:
          type: string
        details:
          type: object
          nullable: true
          additionalProperties: true
          description: >-
            What a plan rejection names (ADR-057). ADDRESS_OVERLAP: overlaps
            (AddressPeriod[]). ADDRESS_COVERAGE_GAP: addressTypeCode, gaps
            (AddressPeriod[]) and stretchCandidates (AddressOccurrence[]).
            ADDRESS_IS_A_CORRECTION: correctedOccurrence (AddressOccurrence).
            ADDRESS_TYPE_COVERAGE_NOT_DECLARED: addressTypeCode.
    AddressPeriod:
      type: object
      required:
        - startDate
      properties:
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          nullable: true
          description: Null means onwards.
    AddressOccurrence:
      type: object
      required:
        - startDate
      properties:
        addressNumber:
          type: integer
          format: int32
          nullable: true
          description: Null only for the address a plan would add, which has no number yet.
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          nullable: true
    PlanAddressChangeRequest:
      type: object
      additionalProperties: false
      required:
        - operation
      properties:
        operation:
          type: string
          enum: [ADD, REMOVE, CORRECT]
          description: >-
            ADD plans a new address of addressTypeCode from startDate to endDate;
            REMOVE plans removing addressNumber; CORRECT plans giving
            addressNumber the dates startDate to endDate.
        addressTypeCode:
          type: string
          maxLength: 30
          description: >-
            Required for ADD: the series the address goes into. Optional for
            REMOVE and CORRECT, whose series is the type of addressNumber; if
            given it has to match.
        addressNumber:
          type: integer
          format: int32
          description: Required for REMOVE and CORRECT.
        startDate:
          type: string
          format: date
          description: Required for ADD and CORRECT.
        endDate:
          type: string
          format: date
          nullable: true
          description: Omit it for an address that stays open.
    AddressPlanAdjustment:
      type: object
      description: The one existing address the plan would move on its own. Only its end date changes.
      required:
        - addressNumber
        - before
        - after
      properties:
        addressNumber:
          type: integer
          format: int32
        before:
          $ref: "#/components/schemas/AddressPeriod"
        after:
          $ref: "#/components/schemas/AddressPeriod"
    AddressPlanResponse:
      type: object
      required:
        - operation
        - accepted
        - addressTypeCode
        - occurrence
        - overlaps
        - gaps
        - stretchCandidates
        - projected
      properties:
        operation:
          type: string
          enum: [ADD, REMOVE, CORRECT]
        accepted:
          type: boolean
        rejection:
          type: string
          nullable: true
          enum: [OVERLAP, GAP_NOT_ALLOWED, IS_A_CORRECTION]
          description: >-
            Why the plan cannot be applied. Null when accepted. An address
            series may outlive the presence, so OUTSIDE_PRESENCE never occurs
            here. IS_A_CORRECTION means the plan is not the operation it was
            asked for: an ADD whose start date is the start date of an existing
            address of the same type is the correction of that one (named in
            correctedOccurrence) and has to be asked for as a CORRECT.
        addressTypeCode:
          type: string
          description: The series the plan is about. Addresses of other types are never in it.
        occurrence:
          $ref: "#/components/schemas/AddressOccurrence"
        correctedOccurrence:
          nullable: true
          description: >-
            On a correction, the address as it stands today, the one occurrence
            replaces. Null on an add and on a removal.
          allOf:
            - $ref: "#/components/schemas/AddressOccurrence"
        adjustedOccurrence:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AddressPlanAdjustment"
        overlaps:
          type: array
          description: Dates two addresses of the type would share.
          items:
            $ref: "#/components/schemas/AddressPeriod"
        gaps:
          type: array
          description: >-
            Stretches of the presence the resulting series would leave without
            an address of the type. Legal, and still reported, when the type is
            optional.
          items:
            $ref: "#/components/schemas/AddressPeriod"
        stretchCandidates:
          type: array
          description: The neighbours of the gaps, which the user could stretch. Named, never moved.
          items:
            $ref: "#/components/schemas/AddressOccurrence"
        projected:
          type: array
          description: The series of the type as it would be, accepted or not.
          items:
            $ref: "#/components/schemas/AddressOccurrence"
    AddressResponse:
      type: object
      required:
        - addressNumber
        - addressTypeCode
        - street
        - city
        - countryCode
        - startDate
      properties:
        addressNumber:
          type: integer
          format: int32
        addressTypeCode:
          type: string
        addressTypeName:
          type: string
          nullable: true
          description: Optional display name from EMPLOYEE_ADDRESS_TYPE rule entities in the employee ruleSystemCode catalog.
        street:
          type: string
        city:
          type: string
        countryCode:
          type: string
          description: ISO 3166-1 alpha-3 code from COUNTRY rule entities in the employee ruleSystemCode catalog.
        postalCode:
          type: string
          nullable: true
        regionCode:
          type: string
          nullable: true
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          nullable: true
