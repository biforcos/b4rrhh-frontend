      type: object
      additionalProperties: false
      required:
        - workCenterCode
        - startDate
      properties:
        workCenterCode:
          type: string
          maxLength: 30
          description: Code validated against active WORK_CENTER rule entities for the employee ruleSystemCode.
        startDate:
          type: string
          format: date
          description: >-
            Start date of the work center assignment (yyyy-MM-dd). Must fall within
            an existing employee presence period. Same-day validity (startDate == endDate) is allowed.
        endDate:
          type: string
          format: date
          nullable: true
          description: >-
            Optional end date (yyyy-MM-dd). When provided, must be >= startDate and the period
            [startDate, endDate] must be fully contained within a single employee presence period.
    EmployeeUpdateWorkCenterRequest:
      type: object
      additionalProperties: false
      required:
        - workCenterCode
        - startDate
      properties:
        workCenterCode:
          type: string
          maxLength: 30
          description: Code validated against active WORK_CENTER rule entities for the employee ruleSystemCode.
        startDate:
          type: string
          format: date
          description: >-
            Corrected start date (yyyy-MM-dd). The resulting period [startDate, endDate]
            must be fully contained within an existing employee presence period.
        endDate:
          type: string
          format: date
