  /payrolls/{ruleSystemCode}/{employeeTypeCode}/{employeeNumber}/{payrollPeriodCode}/{payrollTypeCode}/{presenceNumber}/recalculate:
    post:
      summary: Recalculate a payroll (only allowed from NOT_VALID)
      operationId: recalculatePayroll
      tags:
        - Payroll
      parameters:
        - name: ruleSystemCode
          in: path
          required: true
          schema:
            type: string
        - name: employeeTypeCode
          in: path
          required: true
          schema:
            type: string
        - name: employeeNumber
          in: path
          required: true
          schema:
            type: string
        - name: payrollPeriodCode
          in: path
          required: true
          schema:
            type: string
        - name: payrollTypeCode
          in: path
          required: true
          schema:
            type: string
            enum: [NORMAL, EXTRA]
        - name: presenceNumber
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: Recalculated payroll
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollResponse"
        "404":
          description: Payroll not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollErrorResponse"
        "409":
          description: >-
            The recalculation cannot start. Either the payroll is not in NOT_VALID status, in
            which case the body carries only message, or the calculation unit is claimed by
            another calculation run right now, in which case code is UNIT_ALREADY_CLAIMED and
            details carry the business key. The two are not the same to a caller: the first will
            not change by waiting, the second is the losing side of first-come-first-served and
            is worth retrying in a moment. Recalculation takes the same calculation_claim
            reservation the bulk launch takes and never queues behind it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollErrorResponse"
        "422":
          description: >-
            The engine could not calculate the unit. The request and the payroll state are both
            fine; what cannot be processed is the rule system behind them — a deactivated object
            binding, a table row with no validity for the date, a missing operand. code carries the
            same run message code the bulk launch writes for the unit (UNIT_CALCULATION_ERROR, or
            UNIT_ELIGIBLE_REAL_SKIPPED_MISSING_INPUT when an eligible unit was missing an input),
            so both doors name the same failure the same way and the catalogue already translates
            it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollErrorResponse"

  /payrolls/invalidate-bulk:
    post:
      summary: Bulk invalidation workflow for payroll results
      operationId: bulkInvalidatePayroll
      description: >-
        Synchronous bulk invalidation workflow. Resolves a target employee population, expands to
        presence-based candidate units, and invalidates all existing CALCULATED payrolls for those
        units. Protected payrolls (EXPLICIT_VALIDATED or DEFINITIVE) are skipped and counted
        separately. Already NOT_VALID payrolls are also skipped without error. targetSelection
        semantics mirror those of the payroll launch endpoint. totalCandidates represents expanded
        presence-based units, not the raw number of target employees.
      tags:
        - Payroll
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkInvalidatePayrollRequest"
      responses:
        "200":
          description: Bulk invalidation completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkInvalidatePayrollResponse"
        "400":
          description: Invalid request parameters
        "404":
          description: Rule system or payroll type not found

  /payrolls/finalize-bulk:
    post:
      summary: Bulk close workflow for payroll results
      operationId: bulkFinalizePayroll
      description: >-
        Synchronous bulk close workflow, the third period verb next to the bulk invalidation and
        the calculation launch. It does NOT close a period: there is no period entity to close.
        Closing is applying to many payrolls the same verb POST /payrolls/.../finalize applies to
        one, so it resolves a target employee population, expands to presence-based candidate
        units, and transitions to DEFINITIVE every payroll that is CALCULATED or
        EXPLICIT_VALIDATED. NOT_VALID payrolls are counted apart in totalSkippedNotEligibleByStatus
        and are not errors: NOT_VALID to DEFINITIVE does not exist, because there is nothing to
        protect in an invalid payroll. Closing is irreversible and nothing reopens it; what comes
        afterwards is another payroll. Closing does not forbid calculating in the period either: a
        later hire produces a payroll that was never closed. targetSelection semantics mirror those
        of the payroll launch endpoint. totalCandidates represents expanded presence-based units,
        not the raw number of target employees.
      tags:
        - Payroll
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkFinalizePayrollRequest"
      responses:
        "200":
          description: Bulk close completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkFinalizePayrollResponse"
        "400":
          description: Invalid request parameters
        "404":
          description: Rule system or payroll type not found

  /payroll/calculation-runs/launch:
    post:
      summary: Accept a payroll calculation run and return its identity without waiting
      description: >-
        Accepts a payroll launch workflow for an explicit target selection and returns as soon as
        the calculation run has been persisted, with status REQUESTED. The calculation itself runs
        outside the request: calculating a full workforce takes minutes, and no client or
        intermediary survives that wait. Progress is read from GET /payroll/calculation-
        runs/{runId}, whose counters advance while the run is RUNNING, and from GET
        /payroll/calculation-runs/{runId}/messages. Runs are executed one at a time: a second
        launch stays in REQUESTED, queued and observable, until the one in flight finishes. If the
        queue is full the run is persisted as FAILED with a LAUNCH_REJECTED message instead of
        being silently dropped, so the response always carries the run identity and its real
        status. Request validation is still synchronous: a malformed launch answers 400 and leaves
        no run. This V1 contract supports SINGLE_EMPLOYEE, EMPLOYEE_LIST, and
        ALL_EMPLOYEES_WITH_PRESENCE_IN_PERIOD, and requires payrollPeriodCode in YYYYMM format so
        the backend can resolve relevant employee presences by month overlap. For
        ALL_EMPLOYEES_WITH_PRESENCE_IN_PERIOD, target employees are resolved from the backend as
        all employees with at least one overlapping presence in the payroll month. totalCandidates
        represents expanded presence-based calculation units that overlap at least one day of the
        payroll month, not the raw number of requested or resolved employees. This endpoint
        coordinates launch execution and persists a calculation run; it is not the final payroll
        engine API.
      operationId: launchPayrollCalculation
      tags:
        - Payroll Calculation Run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LaunchPayrollCalculationRequest"
      responses:
        "202":
          description: >-
            Calculation run accepted. The run is persisted and its counters are
            observable while it executes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollCalculationRunResponse"

  /payroll/calculation-runs/{runId}:
    get:
      summary: Get a payroll calculation run by ID
      operationId: getPayrollCalculationRun
      tags:
        - Payroll Calculation Run
      parameters:
