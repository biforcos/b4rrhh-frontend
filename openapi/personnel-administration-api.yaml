  /payroll-engine/{ruleSystemCode}/binding-roles:
    post:
      operationId: createPayrollBindingRole
      summary: Create a binding role - a table slot, which is not a table
      description: >-
        Creates a payroll object of type TABLE whose code the engine uses as a binding role: it
        resolves it through payroll_object_binding to the table that actually holds the values.
        It is a slot, and a slot is not a table (ADR-063).
        This used to be POST /payroll-engine/{ruleSystemCode}/tables, sharing a path with the GET
        that lists tables, and the two looked like the obvious pair without being one: what this
        creates cannot appear in that GET until something else, elsewhere, binds a table with rows
        to it. Sharing the path was what manufactured that illusion, and the contract is read by two
        clients that do not read it twice (backend#98).
        What it creates is a row of the object catalogue, which is why it now lives next to it and
        not under tables. A freshly created binding role does nothing until a concept feeds from it
        and an agreement-level binding ties it to a real table.
      tags: [PayrollEngine]
      parameters:
        - name: ruleSystemCode
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBindingRoleRequest"
      responses:
        "201":
          description: Binding role created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BindingRoleResponse"
        "409":
          description: That binding role already exists in this rule system

  /payroll-engine/{ruleSystemCode}/objects:
    get:
      operationId: listPayrollObjects
      summary: List the payroll objects of a rule system, by type
      description: >-
        The object catalogue: every name the engine knows, by type. A CONCEPT is something the
        engine calculates, a TABLE is a slot that a binding resolves to the rows that hold the
        values, and a CONSTANT is a fixed figure. It is the catalogue and not an inventory of what
        exists elsewhere: a TABLE here is a slot, so asking this for the real tables of a rule
        system answers badly - that is what GET /payroll-engine/{ruleSystemCode}/tables is for, and
        the difference is written there.
        This operation was served from the backend and absent from this contract until
        b4rrhh/designer#11, which is why the designer called it with the path written by hand.
      tags: [PayrollEngine]
      parameters:
        - name: ruleSystemCode
          in: path
          required: true
          schema:
            type: string
        - name: type
          in: query
          required: true
          description: The object type to list. Anything else answers 400.
          schema:
            type: string
            enum: [CONCEPT, TABLE, CONSTANT]
      responses:
        "200":
          description: Objects of that type in the rule system
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PayrollObjectResponse"
        "400":
          description: >-
            The type is not one of the declared object types. The body is the one every
            /payroll-engine operation answers for a bad argument, which today is named after
            concepts because a base-package advice serves the whole context - see b4rrhh/backend#78,
            which is unifying those names.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollConceptErrorResponse"
  /payroll-engine/{ruleSystemCode}/tables:
    get:
      operationId: listPayrollTables
      summary: List the real tables of a rule system, with their row count and who binds them
      description: >-
        Lists tables, not binding roles. A binding role such as BASE_SALARY_TABLE is a slot: the
        engine takes it as a role name and resolves it through payroll_object_binding to the table
        that actually holds the values. Asking the object catalogue instead
        (GET /payroll-engine/{ruleSystemCode}/objects?type=TABLE) answers a different question and
        answers it badly for this one: of the three roles bound in ESP today only one,
        P02_DAILY_AMOUNT_TABLE, exists as a payroll object, so that list shows one of three, and
        the one it shows is a slot and not a table.
        The list is therefore derived from two places and from neither alone: every distinct table
        code that has rows, and every table code that a binding points at. A table with rows that
        nobody binds is listed with an empty bindings array - it exists and nothing reads it. A
        table that a binding points at and that has no rows is listed with rowCount 0 - it is read
        and it is empty. Those two cases are different and this is where they become
        distinguishable, which is the whole reason rowCount is served next to the bindings.
        A binding role with no table bound to it does not appear here, because there is no table to
        list. It remains a node of the graph, which is where it belongs: the canvas.
      tags: [PayrollEngine]
      parameters:
        - name: ruleSystemCode
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tables listed, ordered by table code
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PayrollTableSummaryResponse"
  /payroll-engine/{ruleSystemCode}/tables/{tableCode}/rows:
    get:
      operationId: listTableRows
      summary: List all rows for a salary table
      tags: [PayrollEngine]
      parameters:
        - name: ruleSystemCode
          in: path
          required: true
          schema:
            type: string
        - name: tableCode
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Rows listed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TableRowResponse"
    post:
      operationId: createTableRow
      summary: Add a row to a salary table
      tags: [PayrollEngine]
      parameters:
        - name: ruleSystemCode
          in: path
          required: true
          schema:
            type: string
        - name: tableCode
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTableRowRequest"
      responses:
        "201":
          description: Row created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableRowResponse"
        "400":
          description: >-
            The validity window does not cover whole natural periods. An execution loads its
            rulebook once, asking for a single date (ADR-061), so a window that cuts a period
            in half would silently apply the wrong rules. The message names the field, the
            value received and the day expected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetamodelValidityErrorResponse"
        "409":
          description: Row already exists

  /payroll-engine/{ruleSystemCode}/tables/{tableCode}/rows/{rowId}:
    put:
      operationId: updateTableRow
      summary: Update a salary table row
      tags: [PayrollEngine]
      parameters:
        - name: ruleSystemCode
          in: path
          required: true
          schema:
            type: string
        - name: tableCode
          in: path
          required: true
          schema:
            type: string
        - name: rowId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTableRowRequest"
      responses:
        "200":
          description: Row updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableRowResponse"
        "400":
          description: >-
            The validity window does not cover whole natural periods. An execution loads its
            rulebook once, asking for a single date (ADR-061), so a window that cuts a period
            in half would silently apply the wrong rules. The message names the field, the
            value received and the day expected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetamodelValidityErrorResponse"
        "404":
          description: Row not found
    delete:
      operationId: deleteTableRow
      summary: Delete a salary table row
      tags: [PayrollEngine]
      parameters:
        - name: ruleSystemCode
          in: path
          required: true
          schema:
            type: string
        - name: tableCode
          in: path
          required: true
          schema:
            type: string
        - name: rowId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Row deleted
        "404":
          description: Row not found

components:
  parameters:
    AcceptLanguage:
      in: header
      name: Accept-Language
      required: false
      description: >-
        Language of the catalog labels in the response (ADR-052). Short BCP 47 tag such as
        `es-ES`, `fr-FR` or `en`; the heaviest language of the header is used. Codes never
        change. A label without a translation for that language, a missing header or an
        unrecognised one all fall back to the base literal, silently.
      schema:
        type: string
        example: es-ES
  schemas:
    RuleEntityTranslationCoverageResponse:
      type: object
      required:
        - languageCode
        - types
      properties:
        languageCode:
          type: string
          example: es-ES
        types:
          type: array
          items:
            $ref: "#/components/schemas/RuleEntityTypeTranslationCoverage"

    RuleEntityTypeTranslationCoverage:
      type: object
      required:
        - ruleEntityTypeCode
        - total
        - translated
        - missing
        - missingCodes
      properties:
        ruleEntityTypeCode:
          type: string
        total:
          type: integer
          format: int64
        translated:
          type: integer
          format: int64
        missing:
          type: integer
          format: int64
        missingCodes:
          type: array
          items:
            $ref: "#/components/schemas/RuleEntityMissingTranslation"

    RuleEntityMissingTranslation:
      type: object
      required:
        - ruleSystemCode
        - code
        - name
      properties:
        ruleSystemCode:
          type: string
        code:
          type: string
        name:
          type: string
          description: The base literal that is being served meanwhile.

    RuleEntityErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string

    RuleEntityTranslationErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string

    PayrollLaunchTargetSelectionType:
      type: string
      enum:
        - ALL_EMPLOYEES_WITH_PRESENCE_IN_PERIOD
        - EMPLOYEE_LIST
        - SINGLE_EMPLOYEE

    PayrollLaunchEmployeeTargetRequest:
      type: object
      required:
        - employeeTypeCode
        - employeeNumber
      properties:
        employeeTypeCode:
          type: string
        employeeNumber:
          type: string

    PayrollLaunchTargetSelectionRequest:
      type: object
      description: >-
        Target selection payload. employee is required only for SINGLE_EMPLOYEE. employees is
        required only for EMPLOYEE_LIST. For ALL_EMPLOYEES_WITH_PRESENCE_IN_PERIOD both employee
        and employees must be null.
      required:
        - selectionType
      properties:
        selectionType:
          $ref: "#/components/schemas/PayrollLaunchTargetSelectionType"
        employee:
          description: >-
            Required when selectionType is SINGLE_EMPLOYEE.
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PayrollLaunchEmployeeTargetRequest"
        employees:
          description: >-
            Required when selectionType is EMPLOYEE_LIST.
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/PayrollLaunchEmployeeTargetRequest"

    LaunchPayrollCalculationRequest:
      type: object
      required:
        - ruleSystemCode
        - payrollPeriodCode
        - payrollTypeCode
        - calculationEngineCode
        - calculationEngineVersion
        - targetSelection
      properties:
        ruleSystemCode:
          type: string
        payrollPeriodCode:
          description: >-
            V1 launch requires YYYYMM format to resolve relevant employee presences by monthly
            overlap.
          type: string
        payrollTypeCode:
          type: string
          enum: [NORMAL, EXTRA]
        calculationEngineCode:
          type: string
        calculationEngineVersion:
          type: string
        targetSelection:
          $ref: "#/components/schemas/PayrollLaunchTargetSelectionRequest"

    PayrollCalculationRunResponse:
      type: object
      required:
        - runId
        - status
        - ruleSystemCode
        - payrollPeriodCode
        - payrollTypeCode
        - calculationEngineCode
        - calculationEngineVersion
        - totalCandidates
        - totalEligible
        - totalClaimed
        - totalSkippedNotEligible
        - totalSkippedAlreadyClaimed
        - totalSkippedMissingInput
        - totalCalculated
        - totalNotValid
        - totalErrors
        - requestedAt
      properties:
        runId:
          type: integer
          format: int64
        status:
          type: string
          enum: [REQUESTED, RUNNING, COMPLETED, COMPLETED_WITH_ERRORS, FAILED]
        ruleSystemCode:
          type: string
        payrollPeriodCode:
          type: string
        payrollTypeCode:
          type: string
          enum: [NORMAL, EXTRA]
        calculationEngineCode:
          type: string
        calculationEngineVersion:
          type: string
        totalCandidates:
          description: >-
            Expanded candidate calculation units after presence overlap resolution for the payroll
            month.
          type: integer
          format: int32
        totalEligible:
          description: >-
            Accumulator, not a total: it rises for every unit that passes the eligibility filter,
            and it includes the ones later skipped for missing input or ending in error. The
            denominator of any percentage is totalCandidates.
          type: integer
          format: int32
        totalClaimed:
          type: integer
          format: int32
        totalSkippedNotEligible:
          description: >-
            Skipped because an immutable payroll already existed. Expected on a relaunch; asks
            nothing of anybody. Not counted in totalEligible.
          type: integer
          format: int32
        totalSkippedAlreadyClaimed:
          type: integer
          format: int32
        totalSkippedMissingInput:
          description: >-
            Eligible and could not be calculated because input was missing. Always asks someone
            to look. Counted in totalEligible and in totalClaimed.
          type: integer
          format: int32
        totalCalculated:
          type: integer
          format: int32
        totalNotValid:
          type: integer
          format: int32
        totalErrors:
          type: integer
          format: int32
        requestedAt:
          type: string
          format: date-time
        requestedBy:
          type: string
          nullable: true
          description: Subject that requested the run, taken from the authenticated token. Null for in-process launches, which have nobody behind them.
        startedAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true

    PayrollCalculationRunMessagesResponse:
      type: object
      required:
        - runId
        - items
      properties:
        runId:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: "#/components/schemas/PayrollCalculationRunMessageResponse"

    PayrollCalculationRunMessageResponse:
      type: object
      required:
        - messageCode
        - severityCode
        - message
        - createdAt
      properties:
        messageCode:
          type: string
        messageCodeName:
          type: string
          nullable: true
          description: >-
            Literal del codigo en el idioma de Accept-Language, resuelto del catalogo
            PAYROLL_RUN_MESSAGE (backend#81). Nulo si el codigo no esta sembrado: la
            pantalla pinta entonces el codigo desnudo, que es feo y honesto.
        severityCode:
          type: string
        message:
          type: string
        detailsJson:
          type: string
          nullable: true
          description: JSON payload serialized as string with technical details for diagnostics.
        ruleSystemCode:
          type: string
          nullable: true
        employeeTypeCode:
          type: string
          nullable: true
        employeeNumber:
          type: string
          nullable: true
        payrollPeriodCode:
          type: string
          nullable: true
        payrollTypeCode:
          type: string
          enum: [NORMAL, EXTRA]
          nullable: true
        presenceNumber:
          type: integer
          format: int32
          nullable: true
        createdAt:
          type: string
          format: date-time

    BulkFinalizePayrollRequest:
      type: object
      description: >-
        Request for the bulk close workflow. targetSelection semantics mirror those of the payroll
        launch endpoint. For ALL_EMPLOYEES_WITH_PRESENCE_IN_PERIOD, both employee and employees
        must be null. There is no statusReasonCode: closing does not give a reason, it keeps the
        one the payroll already had. Invalidation does ask for one, because invalidating is a
        decision about something that was fine.
      required:
        - ruleSystemCode
        - payrollPeriodCode
        - payrollTypeCode
        - targetSelection
      properties:
        ruleSystemCode:
          type: string
        payrollPeriodCode:
          description: >-
            Must be in YYYYMM format. Used to resolve presence overlaps for the payroll month.
          type: string
        payrollTypeCode:
          type: string
          enum: [NORMAL, EXTRA]
        targetSelection:
          $ref: "#/components/schemas/PayrollLaunchTargetSelectionRequest"

    BulkFinalizePayrollResponse:
      type: object
      description: >-
        Summary of a completed bulk close workflow. The counters are the deliverable, not
        decoration: NOT_VALID to DEFINITIVE does not exist, so closing 873 payrolls will close the
        calculated and validated ones and leave the rest out, and a counter that says which and why
        shows the state machine instead of explaining it. That is why nothing is lumped into a
        generic "failed": nothing failed. The partition is totalCandidates = totalFinalized +
        totalSkippedAlreadyDefinitive + totalSkippedNotEligibleByStatus + totalSkippedNotFound;
        totalFound is a stage, not a bucket, and adding it to the rest counts twice.
      required:
        - ruleSystemCode
        - payrollPeriodCode
        - payrollTypeCode
        - totalCandidates
        - totalFound
        - totalFinalized
        - totalSkippedAlreadyDefinitive
        - totalSkippedNotEligibleByStatus
        - totalSkippedNotFound
      properties:
        ruleSystemCode:
          type: string
        payrollPeriodCode:
          type: string
        payrollTypeCode:
          type: string
          enum: [NORMAL, EXTRA]
        totalCandidates:
          description: >-
            Total presence-based candidate units expanded from the target population.
          type: integer
          format: int32
        totalFound:
          description: >-
            Payroll rows found in persistence for the candidate units.
          type: integer
          format: int32
        totalFinalized:
          description: >-
            Payrolls transitioned to DEFINITIVE here, from CALCULATED or from EXPLICIT_VALIDATED.
          type: integer
          format: int32
        totalSkippedAlreadyDefinitive:
          description: >-
            Payrolls already DEFINITIVE, skipped without error. Expected when a period is closed
            again.
          type: integer
          format: int32
        totalSkippedNotEligibleByStatus:
          description: >-
            Payrolls whose status does not admit closing, which today is exactly NOT_VALID. This is
            the counter that shows the state machine, and it is deliberately separate from
            everything else.
          type: integer
          format: int32
        totalSkippedNotFound:
          description: >-
            Candidate units with no payroll row: never calculated, or calculated for another
            payroll type.
          type: integer
          format: int32

    BulkInvalidatePayrollRequest:
      type: object
      description: >-
        Request for bulk payroll invalidation workflow. targetSelection semantics mirror those of
        the payroll launch endpoint. For ALL_EMPLOYEES_WITH_PRESENCE_IN_PERIOD, both employee and
        employees must be null.
      required:
        - ruleSystemCode
        - payrollPeriodCode
        - payrollTypeCode
        - statusReasonCode
        - targetSelection
      properties:
        ruleSystemCode:
          type: string
        payrollPeriodCode:
          description: >-
            Must be in YYYYMM format. Used to resolve presence overlaps for the payroll month.
          type: string
        payrollTypeCode:
          type: string
          enum: [NORMAL, EXTRA]
        statusReasonCode:
          description: >-
            Reason code applied to all invalidated payrolls.
          type: string
        targetSelection:
          $ref: "#/components/schemas/PayrollLaunchTargetSelectionRequest"

    BulkInvalidatePayrollResponse:
      type: object
      description: >-
        Summary of a completed bulk invalidation workflow. totalCandidates counts presence-based
        expanded units, not raw target employees. totalFound counts payroll rows actually found
        for those units. Skipped counters explain everything that was not invalidated.
      required:
        - ruleSystemCode
        - payrollPeriodCode
        - payrollTypeCode
        - totalCandidates
        - totalFound
        - totalInvalidated
        - totalSkippedAlreadyNotValid
        - totalSkippedProtected
        - totalSkippedNotFound
        - statusReasonCode
      properties:
        ruleSystemCode:
          type: string
        payrollPeriodCode:
          type: string
        payrollTypeCode:
          type: string
          enum: [NORMAL, EXTRA]
        totalCandidates:
          description: >-
            Total presence-based candidate units expanded from the target population.
          type: integer
          format: int32
        totalFound:
          description: >-
            Payroll rows found in persistence for the candidate units.
          type: integer
          format: int32
        totalInvalidated:
          description: >-
            Payrolls successfully transitioned from CALCULATED to NOT_VALID.
          type: integer
          format: int32
        totalSkippedAlreadyNotValid:
          description: >-
            Payrolls already in NOT_VALID status, skipped without error.
          type: integer
          format: int32
        totalSkippedProtected:
          description: >-
            Payrolls in EXPLICIT_VALIDATED or DEFINITIVE status, protected from bulk invalidation.
          type: integer
          format: int32
        totalSkippedNotFound:
          description: >-
            Candidate units for which no payroll row was found in persistence.
          type: integer
          format: int32
        statusReasonCode:
          description: >-
            Status reason code applied to all invalidated payrolls.
          type: string

