        rejection:
          type: string
          nullable: true
          enum: [OUTSIDE_PRESENCE, OVERLAP, GAP_NOT_ALLOWED, IS_A_CORRECTION]
          description: >-
            Why the plan cannot be applied. Null when accepted. IS_A_CORRECTION
            means the plan is not the operation it was asked for: an ADD whose
            start date is the start date of an existing assignment is the
            correction of that one (named in correctedOccurrence) and has to
            be asked for as a CORRECT.
        occurrence:
          $ref: "#/components/schemas/EmployeeWorkCenterOccurrence"
        correctedOccurrence:
          nullable: true
          description: >-
            On a correction, the assignment as it stands today, the one
            occurrence replaces. Null on an add and on a removal.
