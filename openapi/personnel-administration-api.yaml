    UpsertAbsenceRequest:
      type: object
      properties:
        endDate:
          type: string
          format: date
          nullable: true
          example: "2026-05-18"
        endTime:
          type: string
          nullable: true
          pattern: '^\d{2}:\d{2}$'
          example: "17:30"
        benefitEntitled:
          type: boolean
          nullable: true
          description: >-
            Si la baja lleva derecho a prestacion economica (backend#129). Omitirlo es dejarla con
            derecho, que es el caso normal. Solo significa algo en IT_COMMON: en los demas tipos de
            ausencia no hay prestacion a la que tener derecho.
            Lo decide el INSS con la carencia del art. 172.a) de la LGSS -180 dias cotizados en cinco
            anos-, que es la vida del empleado fuera de esta empresa: la nomina no lo calcula, lo lee.
          example: true

