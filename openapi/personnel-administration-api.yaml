    PayrollCalculationStepResponse:
      type: object
      description: >-
        One evaluation the engine performed while calculating a payroll. Identified by
        executionOrder within the payroll, never by conceptCode: the same concept can appear
        more than once when it is evaluated per segment.
      required:
        - executionOrder
        - conceptCode
        - conceptMnemonic
        - calculationType
        - functionalNature
        - executionScope
        - amount
      properties:
        executionOrder:
          type: integer
          format: int32
          description: >-
            Position of this step in the engine execution plan, starting at 1. This is the row
            identity and the sort key of the response.
        conceptCode:
          type: string
          description: >-
            Engine concept code. Not unique within the response: a SEGMENT scoped concept
            appears once per segment.
        conceptMnemonic:
          type: string
        calculationType:
          type: string
          description: DIRECT_AMOUNT, RATE_BY_QUANTITY, PERCENTAGE, AGGREGATE, LEAST, GREATEST, ENGINE_PROVIDED or EMPLOYEE_INPUT
        functionalNature:
          type: string
          description: EARNING, DEDUCTION, BASE, TECHNICAL, INFORMATIONAL, TOTAL_EARNING, TOTAL_DEDUCTION or NET_PAY
        executionScope:
          type: string
          description: >-
            PERIOD when the step covers the whole period, and then it carries no segment dates.
            Any other scope always carries both. The scope is explicit and must not be inferred
            from the dates being absent.
        segmentStartDate:
          type: string
          format: date
          nullable: true
        segmentEndDate:
          type: string
          format: date
          nullable: true
        amount:
          type: number
          format: double
        quantity:
          type: number
          format: double
          nullable: true
        rate:
          type: number
          format: double
          nullable: true
        payslipOrderCode:
          type: string
          nullable: true
          description: >-
            Payslip print order of this concept, or null when this step never reached the
            payslip. Steps include bases and technical values, so the amount column must not be
            summed: the totals are the payroll totals and only come from the payslip lines.
        payslipLineNumber:
          type: integer
          format: int32
          nullable: true
          description: >-
            Which payslip line this step ended up in, or null when it never reached the payslip.
            Two steps sharing a number are the ones that line merges: same concept, same rate, and
            the payslip adds them into a single row even when their segments are not contiguous.
            This is what lets a repeated step say why it is two — different rates, or the same rate
            reached by different paths — instead of leaving the reader to compare rates by eye. It
            is null exactly when payslipOrderCode is, except in payrolls calculated before this
            field existed, which carry null until they are recalculated.
        sourceTableCode:
          type: string
          nullable: true
          description: >-
            Payroll table this step read its value from, or null when the value did not come from
            a table. Most steps carry null and that is what it means: an AGGREGATE reads no table.
        sourceTableRowId:
          type: integer
          format: int64
          nullable: true
          description: >-
            Row of that table the engine actually read. It is recorded when the value is produced,
            not resolved when it is read: resolving it again would answer where the value would be
            looked up today, and a change of validity or category in between would silently point
            at a different row. The row may have been deleted since, so a client must handle the
            address leading nowhere. Null exactly when sourceTableCode is, plus in payrolls
            calculated before this field existed, which carry null until they are recalculated.

    PayrollConceptResponse:
      type: object
      description: >-
        One payslip line. mergedStepCount says how many engine steps it comes from: one almost
        always, more when the payslip merged several segments of the same concept at the same rate,
        which may not be contiguous. Without it the line is correct and tells a false story, and the
        payslip screen and the calculation screen disagree on the number of rows with nothing
        explaining why. To get from a line to its steps, take the steps of that payroll whose
        payslipLineNumber equals this lineNumber: no grouping has to be reconstructed.


        conceptMnemonic and conceptLabel are two different things and both are here. The mnemonic
        is the concept's IDENTIFIER in the engine — what rules and the graph reference — and the
        label is what the concept was called WHEN THIS LINE WAS CALCULATED. The label is frozen,
        not resolved on read: a payslip is a document, not a view of the catalogue, and renaming a
        concept must not change what an already delivered payslip says.
      required:
        - lineNumber
        - conceptCode
        - conceptMnemonic
        - conceptLabel
        - conceptNatureCode
        - displayOrder
        - mergedStepCount
      properties:
        lineNumber:
          type: integer
        conceptCode:
          type: string
        conceptMnemonic:
          type: string
          example: "SALARIO_BASE"
          description: >-
            The concept's identifier in the engine, frozen with the line. This is what to key on
            to reach the concept, its graph node or its steps — never conceptLabel, which is a
            name and may differ between two payrolls of the same concept.
        conceptLabel:
          type: string
          example: "Salario base"
          description: >-
            What the concept was called when this line was calculated. It is what to show. Two
            payslips of the same concept may carry different labels if the catalogue was renamed
            in between, and that is correct: each says what it said when it was produced. A line
            whose concept had no name falls back to its mnemonic, so a label that looks like an
            identifier means the name is missing, not that the field is wrong.
        amount:
          type: number
        quantity:
          type: number
        rate:
          type: number
        conceptNatureCode:
          type: string
        originPeriodCode:
          type: string
        displayOrder:
          type: integer
        mergedStepCount:
          type: integer
          format: int32
          description: >-
            How many engine steps this line merges. One means the line is one step, and a client
            must not draw any mark: a mark that shows up on every line marks nothing.
        payslipSectionCode:
          type: string
          nullable: true
          example: "DEVENGOS"
          description: >-
            The block of the official payslip model this line was printed in, frozen with the
            line. Group by this and order the groups by the displayOrder that
            GET /payroll-engine/{ruleSystemCode}/payslip-sections gives each section: never infer
            the block from the concept code's numeric range. Null when the concept's nature had
            no section declared — show that, do not default it into some block, because a line
            nobody declared a home for is exactly what needs to be noticed.
        payslipSubsectionCode:
          type: string
          nullable: true
          example: "BASE_CC"
          description: >-
            The part of that block this line was printed in, frozen with the line. Null is the
            normal case — a line is printed in its block with nothing above it — and only the
            contribution-bases box has parts today: the four numbered sections of the official
            model. Unlike the section, this does NOT follow from the nature: the ten lines of
            that box are all BASE and live in four different parts, so it is declared by the
            concept. Group by it inside the block and order the parts by the displayOrder that
            GET /payroll-engine/{ruleSystemCode}/payslip-sections gives each one.
    PayrollSummaryResponse:
      type: object
      required:
