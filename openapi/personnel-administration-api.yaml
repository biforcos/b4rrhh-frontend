  /companies/{ruleSystemCode}/{companyCode}:
    get:
      operationId: getCompany
      summary: Get aggregated company by business key
      tags:
        - Company
      description: |
        Resolves the COMPANY occurrence applicable on the current server date and returns its aggregated data.
        If company_profile does not exist yet, the response falls back to base COMPANY data and empty profile fields.
      parameters:
        - in: path
          name: ruleSystemCode
          required: true
          schema:
            type: string
            maxLength: 5
        - in: path
          name: companyCode
          required: true
          schema:
            type: string
            maxLength: 30
      responses:
        "200":
          description: Aggregated company found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyResponse"
        "400":
          description: Invalid path parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyErrorResponse"
        "404":
          description: Company does not exist for the business key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyErrorResponse"
        "409":
          description: Company exists but is not applicable today
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyErrorResponse"
    put:
      operationId: updateCompany
      summary: Update aggregated company by business key
      tags:
        - Company
      description: |
        Resolves the COMPANY occurrence applicable on the current server date and updates both
        base COMPANY mutable fields and the associated company_profile.
        If company_profile does not exist yet, this operation creates it as part of the aggregated update.
      parameters:
        - in: path
          name: ruleSystemCode
          required: true
          schema:
            type: string
            maxLength: 5
        - in: path
          name: companyCode
          required: true
          schema:
            type: string
            maxLength: 30
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCompanyRequest"
      responses:
        "200":
          description: Company updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyResponse"
        "400":
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyErrorResponse"
        "404":
          description: Company does not exist for the business key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyErrorResponse"
        "409":
          description: Company exists but is not applicable today
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyErrorResponse"

  /companies/{ruleSystemCode}/{companyCode}/profile:
    get:
      operationId: getCompanyProfile
      summary: Get enriched company profile by business key
      tags:
        - Company Profile
      description: |
        Resolves the COMPANY base occurrence by business key using the occurrence applicable on the current server date.
        If no COMPANY occurrence is applicable today, the profile is not reachable through this endpoint.
      parameters:
        - in: path
          name: ruleSystemCode
          required: true
          schema:
            type: string
            maxLength: 5
        - in: path
          name: companyCode
          required: true
          schema:
            type: string
            maxLength: 30
      responses:
        "200":
          description: Company profile found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyProfileResponse"
        "404":
          description: Company does not exist, is not applicable today, or profile has not been created yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyProfileErrorResponse"
        "400":
          description: Invalid path parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyProfileErrorResponse"
    put:
      operationId: upsertCompanyProfile
      summary: Create or update enriched company profile by business key
      tags:
        - Company Profile
      description: |
        Resolves the COMPANY base occurrence by business key using the occurrence applicable on the current server date.
        Upsert is only allowed for a COMPANY occurrence that is active/applicable today.
      parameters:
        - in: path
          name: ruleSystemCode
          required: true
          schema:
            type: string
            maxLength: 5
        - in: path
          name: companyCode
          required: true
          schema:
            type: string
            maxLength: 30
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertCompanyProfileRequest"
      responses:
        "200":
          description: Company profile stored
          content:
            application/json:
              schema:
