# ============================================================
#  CI/CD del frontend de B4RRHH
#
#  Mismo esqueleto que el del backend, con dos diferencias: aqui no hace
#  falta base de datos (los tests van sobre jsdom) y quien construye es
#  Node en vez de Maven.
#
#  Los tests corren en un contenedor aparte y no en el del job para no
#  depender de que la imagen del runner traiga Node 22, y para usar la
#  misma version con la que se construye la imagen de produccion.
# ============================================================
name: Test, build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: 192.168.1.104:3000/b4rrhh
  IMAGEN: b4rrhh-web
  SERVIDOR: 192.168.1.151
  NODE: node-${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Pasar la suite
        run: |
          docker rm -f -v "${{ env.NODE }}" 2>/dev/null || true

          # Techos sobre lo que tiene la CT104 (8 hilos, 12 GB), donde vive
          # tambien Gitea. Sin ellos, un build deja la web sin responder.
          #
          # --no-watch explicito: 'ng test' se queda escuchando cambios si no
          # detecta que esta en CI, y el job se quedaria colgado para siempre
          # con la suite en verde.
          #
          # La JRE y el api:generate no son opcionales: el cliente del contrato
          # esta en .gitignore, asi que en un checkout limpio no existe y la
          # mitad del codigo no compila. Se genera desde
          # openapi/personnel-administration-api.yaml, que si esta versionado.
          #
          # lint:styles es el candado del sistema de color (#3): tumba el
          # build si un .scss de componente trae un color literal.
          # lint:icons es el del set de iconos (#11): tumba el build si vuelve
          # a colarse un icono de primeicons (pi pi-*).
          # lint:inline-styles cierra el hueco del primero (#41): tumba el
          # build si un componente trae `styles:` en el .ts, que es donde el
          # candado del color no llega.
          # format:check es el candado de Prettier (#38): tumba el build si
          # entra un fichero sin formatear. Va con los otros dos candados,
          # antes de api:generate: el cliente generado no se formatea (esta
          # en .gitignore y Prettier lo respeta), asi que no hace falta
          # tenerlo para comprobarlo.
          docker create \
            --name "${{ env.NODE }}" \
            --cpus 5 \
            -m 4g \
            -e CI=true \
            -e TZ=Europe/Madrid \
            -v b4rrhh-npm:/root/.npm \
            -w /app \
            node:22-alpine \
            sh -c "apk add --no-cache openjdk21-jre-headless \
                   && npm ci \
                   && npm run lint:styles \
                   && npm run lint:icons \
                   && npm run lint:inline-styles \
                   && npm run format:check \
                   && npm run api:generate \
                   && npm test -- --no-watch"

          # El "/." copia el CONTENIDO: docker create -w /app ya ha creado
          # /app, y sin el la carpeta entraria dentro (/app/frontend/...).
          docker cp "$GITHUB_WORKSPACE/." "${{ env.NODE }}":/app

          # -a propaga el codigo de salida: si un test falla, el paso falla.
          docker start -a "${{ env.NODE }}"

      - name: Entrar en el registry
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" \
            | docker login ${{ env.REGISTRY }} -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Construir y subir la imagen
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.IMAGEN }}:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGEN }}:latest \
            .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGEN }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGEN }}:latest

      - name: Preparar la llave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H ${{ env.SERVIDOR }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Desplegar
        run: |
          # Solo se toca .env.web-tag: el del backend vive aparte para que
          # publicar el front no le cambie la imagen a la api.
          ssh -i ~/.ssh/deploy deploy@${{ env.SERVIDOR }} \
            "cd /opt/b4rrhh && \
             [ -f .env.api-tag ] || echo 'API_TAG=latest' > .env.api-tag && \
             [ -f .env.designer-tag ] || echo 'DESIGNER_TAG=latest' > .env.designer-tag && \
             echo 'WEB_TAG=${{ github.sha }}' > .env.web-tag && \
             docker compose --env-file .env --env-file .env.api-tag --env-file .env.web-tag --env-file .env.designer-tag pull web && \
             docker compose --env-file .env --env-file .env.api-tag --env-file .env.web-tag --env-file .env.designer-tag up -d && \
             docker image prune -f"

      - name: Comprobar que sigue en pie
        run: |
          sleep 10
          ssh -i ~/.ssh/deploy deploy@${{ env.SERVIDOR }} \
            "cd /opt/b4rrhh && docker compose ps --format '{{.Name}} {{.Status}}'"

      - name: Recoger el contenedor de los tests y podar el runner
        if: always()
        run: |
          # -v: sin el, "docker rm" deja vivo cualquier volumen anonimo del
          # contenedor. Aqui no hay Postgres, pero el patron es el mismo que en
          # el backend y la fuga se paga igual (issue #13).
          docker rm -f -v "${{ env.NODE }}" 2>/dev/null || true

          # Lo que se acumulaba en el runner (issue #13). Esto corre en el dind
          # del act-runner, que nadie mira: "docker system df" en la CT no lo
          # ensena, hay que hacer "docker exec act-runner docker system df".
          #
          # Imagenes: cada build etiqueta con el sha y las deja ahi. Se guardan
          # latest y las dos mas recientes de cada repositorio de b4rrhh, por si
          # hay que volver atras sin pasar por el registry. Las de otros
          # proyectos que comparten el runner no se tocan desde aqui.
          # "docker images" lista de mas nueva a mas vieja.
          for repo in $(docker images --format '{{.Repository}}' \
                          --filter "reference=${{ env.REGISTRY }}/*" | sort -u); do
            docker images "$repo" --format '{{.Tag}}' \
              | grep -v -e '^latest$' -e '^<none>$' \
              | tail -n +3 \
              | xargs -r -I{} docker rmi "$repo:{}" || true
          done
          docker image prune -f || true

          # Cache de build: 144 entradas y 2 GB que no usaba nadie. No se vacia
          # del todo (cada build seria un build desde cero): se tira lo que
          # lleva una semana sin usarse.
          docker builder prune -af --filter until=168h || true
