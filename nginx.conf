server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Las tres cabeceras de seguridad. Van en un include porque hay que repetirlas
    # en cada bloque que tenga `add_header` propio: en nginx uno propio descarta
    # todos los heredados, y asi el documento se quedaba sin ninguna (frontend#67).
    include /etc/nginx/b4rrhh-security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # Lo unico que no cambia nunca es lo que Angular emite con hash en el nombre
    # (outputHashing: all): main-XXXXXXXX.js, styles-XXXXXXXX.css, las fuentes...
    # Un contenido nuevo es un nombre nuevo, asi que el navegador no necesita
    # revalidar jamas. La regla dice eso, no una lista de extensiones (issue #7).
    #
    # OJO: ~ y no ~*. El hash de esbuild es siempre en mayusculas, y con ~* el
    # [A-Z0-9] tambien acepta minusculas: cualquier fichero de nombre fijo cuyo
    # ultimo tramo tras un guion midiera 8 caracteres entraria aqui y se quedaria
    # clavado un ano. Ya pasaba con /icons/mas-opciones.svg ("opciones", 8).
    location ~ "-[A-Z0-9]{8}\.(js|css|woff2?|ttf|eot|otf|png|jpg|jpeg|gif|svg|ico|webp)$" {
        include /etc/nginx/b4rrhh-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Todo lo demas que es estatico tiene nombre fijo y SI cambia con el mismo
    # nombre: favicon, app icons, manifest, brand/, icons/ (y su sprite, que se
    # reescribe con cada icono nuevo). Cacheable, pero revalidable.
    location ~* \.(js|css|woff2?|ttf|eot|otf|png|jpg|jpeg|gif|svg|ico|webp|webmanifest|json|txt|xml)$ {
        include /etc/nginx/b4rrhh-security-headers.conf;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # El documento. Es el bloque que descubrio el problema: la SPA resuelve TODAS
    # sus rutas con try_files hacia aqui, asi que este era el unico sitio donde
    # X-Frame-Options significaba algo y el unico que no la recibia.
    location = /index.html {
        include /etc/nginx/b4rrhh-security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # El designer, que se sirve del mismo origen a proposito: mismo origen es
    # lo que hace que comparta el localStorage con esta SPA y, con el, la
    # sesion. En otro dominio el visitante se encontraria un segundo login.
    #
    # OJO CON EL ^~, que no es decorativo. En nginx una localizacion por
    # expresion regular gana a una por prefijo, y aqui arriba hay dos que casan
    # por extension en cualquier punto de la ruta: /designer/assets/index-XXXX.js
    # entraria por ellas y se resolveria con try_files contra la raiz de ESTE
    # contenedor, donde no existe. Resultado: 404 en los assets y pantalla en
    # blanco. El ^~ dice "si este prefijo es el que casa, no mires las regex".
    location ^~ /designer/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_designer http://designer:80;

        proxy_pass $upstream_designer$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Sin la barra final no hay salto: quien escriba /designer a pelo se comeria
    # el try_files de la SPA de Angular y veria un "no encontrado" suyo.
    location = /designer {
        return 301 /designer/;
    }

    # UNA sola regla para toda la API. Este es el pago del prefijo /api:
    # el dia que el backend estrene un recurso, aqui no hay que tocar nada.
    location /api/ {
        # DNS interno de Docker. Sin estas dos lineas, nginx resuelve "api"
        # UNA sola vez al arrancar y se queda con esa IP para siempre: si el
        # backend se recrea despues y Docker le da otra, nginx sigue mandando
        # paquetes a un sitio vacio y devuelve 502 hasta que lo reinicias.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_api http://api:8080;

        # Con una variable en proxy_pass, nginx deja de anadir la ruta por su
        # cuenta: hay que pasarle $request_uri, que incluye ruta y query.
        proxy_pass $upstream_api$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 60s;
    }

    # Angular es una SPA: cualquier ruta desconocida la resuelve el front.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
