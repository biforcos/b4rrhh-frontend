# Las tres cabeceras de seguridad del documento y de los estaticos.
#
# Estan en un fichero aparte y NO sueltas en el server porque en nginx un
# `add_header` dentro de un bloque descarta TODOS los heredados. El server las
# ponia una sola vez y las perdian los tres bloques que traen su propio
# Cache-Control -entre ellos `location = /index.html`, que es por donde la SPA
# sirve TODAS sus rutas via try_files-. O sea que la unica pagina donde
# X-Frame-Options significa algo era justo la que no la recibia, y el fichero
# decia que si (frontend#67).
#
# Repetirlas es lo que manda nginx; lo que no hace falta es repetir sus VALORES.
# Si algun dia se anade otro bloque con `add_header`, tiene que incluir esto
# tambien: lo vigila `npm run lint:nginx`.
#
# SAMEORIGIN y no DENY: el designer se sirve en /designer/ del mismo origen para
# que la Valorizacion lo enmarque, y DENY prohibe el marco tambien al mismo
# origen (frontend#66).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
