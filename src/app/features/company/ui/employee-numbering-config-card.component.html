<div class="numbering-card">
  <h3 class="numbering-card__title">Numeración de matrícula</h3>

  @if (loading()) {
    <p class="numbering-card__hint">Cargando...</p>
  } @else {
    @if (notConfigured()) {
      <p class="numbering-card__hint">
        Sin configurar — introduce los valores para activar la autonumeración.
      </p>
    }

    <div class="numbering-card__fields">
      <div class="numbering-card__field">
        <label class="numbering-card__label" for="numbering-prefix">Prefijo</label>
        <input
          id="numbering-prefix"
          pInputText
          [fluid]="true"
          [ngModel]="draftPrefix()"
          (ngModelChange)="draftPrefix.set($event)"
          placeholder="EMP"
          maxlength="14"
        />
      </div>

      <div class="numbering-card__field">
        <label class="numbering-card__label" for="numbering-length">Dígitos numéricos</label>
        <p-inputNumber
          inputId="numbering-length"
          [fluid]="true"
          [ngModel]="draftNumericPartLength()"
          (ngModelChange)="draftNumericPartLength.set($event)"
          [min]="1"
          [max]="14"
        />
      </div>

      <div class="numbering-card__field">
        <label class="numbering-card__label" for="numbering-step">Incremento</label>
        <p-inputNumber
          inputId="numbering-step"
          [fluid]="true"
          [ngModel]="draftStep()"
          (ngModelChange)="draftStep.set($event)"
          [min]="1"
        />
      </div>

      <div class="numbering-card__field">
        <label class="numbering-card__label" for="numbering-next">Siguiente valor</label>
        <p-inputNumber
          inputId="numbering-next"
          [fluid]="true"
          [ngModel]="draftNextValue()"
          (ngModelChange)="draftNextValue.set($event)"
          [min]="1"
        />
      </div>
    </div>

    <div class="numbering-card__actions">
      <div class="numbering-card__preview">
        <span class="numbering-card__preview-label">Siguiente matrícula</span>
        <span class="numbering-card__preview-value">{{ preview() }}</span>
      </div>
      <p-button label="Guardar" [loading]="saving()" (onClick)="save()" />
    </div>
  }
</div>
