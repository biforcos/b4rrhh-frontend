<section
  id="employee-section-payroll"
  class="employee-area"
  [attr.aria-label]="texts.payrollAreaLabel"
>
  <!--
    Los bloques de esta página son secciones, no cajas (`frontend#56`). La caja la lleva lo que
    manda —el bloque «Hoy» de la relación—, y aquí no hay ninguno: son contenido mantenido con su
    historia, así que van con rótulo, filete y aire, como las de la relación. Antes cada uno venía
    envuelto en `employee-area__module`, una caja declarada por la propia feature, y dentro había
    otra: card en «Entradas de nómina» y `boxed` en «Información Fiscal». Caja dentro de caja es
    justo lo que el ADR-051 §3 dice que no se haga.
  -->
  <div class="employee-area__modules">
    <app-employee-tax-information-section [employeeKey]="activeEmployeeKey()" />
    <app-employee-payroll-input-section [employeeKey]="activeEmployeeKey()" />

    <!--
      Las correcciones a meses ya entregados van en Nómina y no en la relación laboral
      (`b4rrhh/frontend#86`), aunque las generen verticales de la relación. Lo que la fila dice no es
      qué le pasó al empleado —eso ya está en su carril— sino que hay un mes de nómina entregado que
      dejó de cuadrar y que alguien va a cobrar la diferencia. Su unidad es el período de nómina, y
      el sitio donde eso se lee es éste.

      Y va después de «Entradas de nómina» a propósito: meter horas a un mes cerrado es lo que deja
      una fila ahí abajo, así que la causa queda justo encima del efecto.
    -->
    <app-employee-retro-mark-section
      id="employee-section-retro-marks"
      [employeeBusinessKey]="activeEmployeeKey()"
    />

    <!--
      El salto a sus recibos (frontend#68). Es un enlace y no una pantalla: desde el frontend#64
      el recibo tiene direccion, y la lista de Nominas ya sabe filtrar por empleado.

      Lleva a la lista filtrada y no «a su recibo»: un empleado no tiene uno, tiene el de cada
      periodo y puede tener varias presencias. Elegir por el visitante obligaria a decidir cual es
      «el ultimo» con varias presencias abiertas, y esa decision no la tiene esta pantalla.
    -->
    @if (activeEmployeeKey(); as employeeKey) {
      <section class="receipts-link" [attr.aria-label]="texts.payrollReceiptsTitle">
        <app-section-heading [title]="texts.payrollReceiptsTitle" />
        <p class="receipts-link__body">{{ texts.payrollReceiptsBody }}</p>
        <a
          class="receipts-link__action"
          [routerLink]="receiptsRouteCommands"
          [queryParams]="{ employeeNumber: employeeKey.employeeNumber }"
        >
          {{ texts.payrollReceiptsLink }}
        </a>
      </section>
    }
  </div>
</section>
