<section class="employee-timeline-panel" aria-label="Historial del empleado">
  <h2 class="employee-timeline-panel__title">Historial</h2>

  <div class="employee-timeline-panel__list" role="list" aria-label="Hechos de la relación laboral">
    @for (event of events; track event.title) {
      <article
        class="employee-timeline-panel__item"
        role="listitem"
        [class.employee-timeline-panel__item--current]="event.current"
        [class.employee-timeline-panel__item--previous]="!event.current"
      >
        <span class="employee-timeline-panel__dot" aria-hidden="true"></span>
        <div class="employee-timeline-panel__content">
          <p class="employee-timeline-panel__item-title">{{ event.title }}</p>
          <p class="employee-timeline-panel__item-period">{{ event.period }}</p>
        </div>
      </article>
    }
  </div>
</section>
