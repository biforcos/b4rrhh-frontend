<app-entity-header
  class="employee-page-header"
  [title]="fullName()"
  [subtitle]="subtitle()"
  [metadata]="metadata()"
  [status]="statusBadge()"
  [avatarText]="initials()"
  [photoUrl]="photoUrl()"
>
  <div
    entityHeaderActions
    class="employee-page-header__actions"
    [attr.aria-label]="texts.employeePageHeaderActionsAriaLabel"
  >
    <app-ui-button
      type="button"
      severity="secondary"
      [outlined]="true"
      size="small"
      icon="imprimir"
      label="Exportar PDF"
      (pressed)="requestPrint()"
    />
    <app-ui-button
      type="button"
      severity="secondary"
      [outlined]="true"
      size="small"
      [label]="texts.employeePageHeaderEditIdentityAction"
      (pressed)="requestEditIdentity()"
    />
    @if (isActive()) {
      <app-ui-button
        type="button"
        class="employee-page-header__danger-action"
        severity="danger"
        size="small"
        [label]="texts.employeePageHeaderTerminateAction"
        (pressed)="requestTerminate()"
      />
    } @else {
      <app-ui-button
        type="button"
        class="employee-page-header__neutral-action"
        severity="contrast"
        [outlined]="true"
        size="small"
        [label]="texts.employeePageHeaderRehireAction"
        (pressed)="requestRehire()"
      />
    }
  </div>
</app-entity-header>
