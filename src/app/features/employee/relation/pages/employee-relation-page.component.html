<section class="employee-relation" [attr.aria-label]="texts.relationAreaLabel">
  <!-- La línea de vida: la historia, de un vistazo. -->
  <div id="employee-section-lifeline" class="employee-relation__lane">
    <app-employee-lifeline
      [presences]="presences()"
      [contracts]="contracts()"
      [workingTimes]="workingTimes()"
      [laborClassifications]="laborClassifications()"
      [workCenters]="workCenters()"
      [loading]="lifelineLoading()"
      (laneRequested)="goToLane($event)"
    />
  </div>

  <!-- Hoy: el borde derecho de la línea de vida, escrito. Primero el estado actual, después la historia (frontend#25). -->
  <app-employee-today-strip
    class="employee-relation__today"
    [presences]="presences()"
    [contracts]="contracts()"
    [workingTimes]="workingTimes()"
    [laborClassifications]="laborClassifications()"
    [workCenters]="workCenters()"
    [costCenter]="currentCostCenter()"
    (laneRequested)="goToLane($event)"
  />

  <!-- Los carriles, en el mismo orden que en el eje. La presencia primero: gobierna. -->
  <app-employee-presence-section class="employee-relation__lane" [employeeKey]="activeEmployeeKey()" />
  <app-employee-contract-section class="employee-relation__lane" [employeeBusinessKey]="activeEmployeeKey()" />
  <app-employee-working-time-section class="employee-relation__lane" [employeeBusinessKey]="activeEmployeeKey()" />
  <app-employee-labor-classification-section class="employee-relation__lane" [employeeBusinessKey]="activeEmployeeKey()" />
  <app-employee-work-center-section class="employee-relation__lane" [employeeKey]="activeEmployeeKey()" />
  <app-employee-cost-center-section class="employee-relation__lane" [employeeKey]="activeEmployeeKey()" />
</section>
