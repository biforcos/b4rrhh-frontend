<div class="work-center-section">
  <app-temporal-section
    anchorId="employee-section-work-center"
    title="Centro de trabajo"
    [rows]="rows()"
    (addClicked)="openCreate()"
    (editClicked)="openEdit($event)"
    (deleteClicked)="confirmDelete($event)"
  >
    <ng-template #columnHeaders><th>Centro</th></ng-template>
    <ng-template #cellContent let-row>
      <td>{{ row.workCenterName || row.workCenterCode }}</td>
    </ng-template>
  </app-temporal-section>

  <app-period-modal
    [title]="modalTitle()"
    [visible]="modalVisible()"
    [saving]="saving()"
    [submitEnabled]="isSubmitEnabled()"
    [showCloseAction]="modalMode() === 'edit' && editingIsActive()"
    (visibleChange)="modalVisible.set($event)"
    (submitted)="submit()"
    (cancelled)="closeModal()"
    (closeActionClicked)="switchToClose()"
  >
    @if (modalMode() !== 'close') {
      <app-ui-select [options]="workCenterOptions()" [value]="workCenterCodeDraft()" (valueChanged)="workCenterCodeDraft.set($event)" />
      <app-ui-date-input [value]="startDateDraft()" (valueChanged)="startDateDraft.set($event)" />
      <app-ui-date-input [value]="endDateDraft()" (valueChanged)="endDateDraft.set($event)" />
    }
    @if (modalMode() === 'close') {
      <app-ui-date-input [value]="endDateDraft()" (valueChanged)="endDateDraft.set($event)" />
    }
  </app-period-modal>
</div>
