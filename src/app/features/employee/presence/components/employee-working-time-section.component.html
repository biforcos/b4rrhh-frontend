<app-temporal-section
  anchorId="employee-section-working-time"
  title="Jornada"
  [addLabel]="texts.workingTimeSectionAddTitle"
  [rows]="rows()"
  (addClicked)="openAdd()"
  (editClicked)="openCorrect($event)"
  (deleteClicked)="openRemove($event)"
>
  <ng-template #columnHeaders>
    <th class="temporal-section__th">%</th>
    <th class="temporal-section__th">Horas/semana</th>
  </ng-template>
  <ng-template #cellContent let-row>
    <td class="temporal-section__td">{{ row.workingTimePercentage }} %</td>
    <td class="temporal-section__td">
      {{ row.weeklyHours | number: '1.0-2' }} h/semana
      <span class="temporal-section__code">{{ row.dailyHours | number: '1.0-2' }} h/día</span>
    </td>
  </ng-template>
</app-temporal-section>

<!-- El aviso bajo el formulario es el plan del backend (ADR-057): qué se cierra o se reabre, o
     el hueco o solape con fechas que impide confirmar. -->
<app-period-modal
  [title]="modalTitle()"
  [subtitle]="modalSubtitle()"
  [visible]="modalVisible()"
  [saving]="saving()"
  [submitEnabled]="isSubmitEnabled()"
  [submitLabel]="submitLabel()"
  [note]="noteLines()"
  [noteTone]="noteTone()"
  (visibleChange)="modalVisible.set($event)"
  (submitted)="submit()"
  (cancelled)="closeModal()"
>
  @if (modalMode() !== 'remove') {
    <app-ui-date-input
      [ariaLabel]="texts.workingTimeSectionStartDateAriaLabel"
      [value]="startDateDraft()"
      (valueChanged)="startDateDraft.set($event)"
    />
    <app-ui-date-input
      [ariaLabel]="texts.workingTimeSectionEndDateAriaLabel"
      [value]="endDateDraft()"
      (valueChanged)="endDateDraft.set($event)"
    />
    <app-ui-input-number
      [ariaLabel]="texts.workingTimeSectionPercentageAriaLabel"
      [value]="percentageDraft()"
      (valueChanged)="percentageDraft.set($event)"
      [min]="1"
      [max]="100"
    />
  }
</app-period-modal>
