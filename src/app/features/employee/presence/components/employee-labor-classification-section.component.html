<app-temporal-section
  anchorId="employee-section-classification"
  title="Convenio"
  [addLabel]="texts.laborClassificationSectionAddTitle"
  [rows]="rows()"
  (addClicked)="openAdd()"
  (editClicked)="openCorrect($event)"
>
  <ng-template #columnHeaders>
    <th class="temporal-section__th">Convenio</th>
    <th class="temporal-section__th">Categoría</th>
    <th class="temporal-section__th">Grupo SS</th>
  </ng-template>
  <ng-template #cellContent let-row>
    <!-- ADR-051 §4: el código nunca va solo. -->
    <td class="temporal-section__td">
      <app-ui-catalog-label [name]="row.agreementLabel" [code]="row.agreementCode" />
    </td>
    <td class="temporal-section__td">
      @if (row.agreementCategoryCode; as categoryCode) {
        <app-ui-catalog-label [name]="row.categoryLabel" [code]="categoryCode" />
      } @else {
        <span class="temporal-section__secondary">—</span>
      }
    </td>
    <td class="temporal-section__td">
      @if (row.grupoCotizacionCode) {
        Grupo {{ row.grupoCotizacionCode }}
      } @else {
        <span class="temporal-section__secondary">—</span>
      }
    </td>
  </ng-template>
</app-temporal-section>

<!-- El aviso bajo el formulario es el plan del backend (ADR-057): qué clasificación se cierra y en
     qué fecha, o el hueco o solape con fechas que impide confirmar. Cuando el rechazo nombra una
     corrección, el aviso trae también la salida. -->
<app-period-modal
  [title]="modalTitle()"
  [subtitle]="modalSubtitle()"
  [visible]="modalVisible()"
  [saving]="saving()"
  [submitEnabled]="isSubmitEnabled()"
  [submitLabel]="submitLabel()"
  [note]="noteLines()"
  [noteTone]="noteTone()"
  [noteActionLabel]="correctionOffer()"
  (visibleChange)="modalVisible.set($event)"
  (submitted)="submit()"
  (cancelled)="closeModal()"
  (noteActionClicked)="switchToCorrection()"
>
  <app-ui-date-input
    [ariaLabel]="texts.laborClassificationSectionStartDateAriaLabel"
    [value]="startDateDraft()"
    (valueChanged)="updateStartDate($event)"
  />
  <app-ui-date-input
    [ariaLabel]="texts.laborClassificationSectionEndDateAriaLabel"
    [value]="endDateDraft()"
    (valueChanged)="endDateDraft.set($event)"
  />
  <app-ui-select
    [options]="agreementOptions()"
    [value]="agreementCodeDraft()"
    (valueChanged)="updateAgreementCode($event)"
  />
  <app-ui-select
    [options]="categoryOptions()"
    [value]="agreementCategoryCodeDraft()"
    [disabled]="categoryDisabled()"
    (valueChanged)="agreementCategoryCodeDraft.set($event)"
  />
</app-period-modal>
