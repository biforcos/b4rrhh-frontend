<app-temporal-section
  [title]="texts.presenceBlockTitle"
  [rows]="rows()"
  [governs]="true"
  [addLabel]="null"
  [emptyMessage]="texts.presenceBlockEmptyMessage"
  anchorId="employee-section-presence"
>
  <ng-template #columnHeaders>
    <th class="temporal-section__th">{{ texts.presenceBlockCompanyLabel }}</th>
    <th class="temporal-section__th">{{ texts.presenceBlockEntryReasonLabel }}</th>
    <th class="temporal-section__th">{{ texts.presenceBlockExitReasonLabel }}</th>
  </ng-template>
  <ng-template #cellContent let-row>
    <!-- ADR-051 §4: el código nunca va solo. -->
    <td class="temporal-section__td">
      <app-ui-catalog-label [name]="row.companyName" [code]="row.companyCode" />
    </td>
    <td class="temporal-section__td">
      <app-ui-catalog-label [name]="row.entryReasonName" [code]="row.entryReasonCode" />
    </td>
    <td class="temporal-section__td">
      @if (row.exitReasonCode; as exitReasonCode) {
        <app-ui-catalog-label [name]="row.exitReasonName" [code]="exitReasonCode" />
      } @else {
        <span class="temporal-section__secondary">—</span>
      }
    </td>
  </ng-template>
</app-temporal-section>
