<section id="employee-section-presence" class="employee-area" [attr.aria-label]="texts.laborAreaLabel">
  <div class="employee-area__state-stack">
    @if (laborAreaLoading()) {
      <p class="employee-area__state">{{ texts.laborLoadingMessage }}</p>
    }

  </div>

  <div class="employee-area__modules">
    <section class="employee-area__module">
      <app-employee-presence-section [employeeKey]="activeEmployeeKey()" />
    </section>

    <section class="employee-area__module">
      <app-employee-contract-section [employeeBusinessKey]="activeEmployeeKey()" />
    </section>

    <section class="employee-area__module">
      <app-employee-working-time-section [employeeBusinessKey]="activeEmployeeKey()" />
    </section>

    <section class="employee-area__module">
      <app-employee-labor-classification-section [employeeBusinessKey]="activeEmployeeKey()" />
    </section>

  </div>
</section>
