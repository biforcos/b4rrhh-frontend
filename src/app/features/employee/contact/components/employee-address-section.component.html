<app-temporal-section
  anchorId="employee-section-addresses"
  [title]="texts.addressesSectionTitle"
  [rows]="rows()"
  [addLabel]="texts.addressesSectionAddAction"
  [emptyMessage]="texts.addressesSectionEmptyMessage"
  (addClicked)="openCreate()"
  (editClicked)="openEdit($event)"
>
  <ng-template #columnHeaders>
    <th class="temporal-section__th">{{ texts.addressesSectionTypeLabel }}</th>
    <th class="temporal-section__th">{{ texts.addressesSectionAddressColumn }}</th>
  </ng-template>
  <ng-template #cellContent let-row>
    <!-- ADR-051 §4: el código nunca va solo. -->
    <td class="temporal-section__td">
      <app-ui-catalog-label [name]="row.addressTypeName" [code]="row.addressTypeCode" />
    </td>
    <td class="temporal-section__td">
      {{ row.street }}
      <span class="temporal-section__secondary address-row__locality">
        @if (row.locality) {
          {{ row.locality }} ·
        }
        {{ row.countryCode }}
      </span>
    </td>
  </ng-template>
</app-temporal-section>

<app-period-modal
  [title]="modalTitle()"
  [visible]="modalVisible()"
  [saving]="saving()"
  [submitEnabled]="isSubmitEnabled()"
  [submitLabel]="submitLabel()"
  [showCloseAction]="modalMode() === 'edit' && editingIsActive()"
  [closeActionLabel]="texts.addressesSectionCloseAction"
  (visibleChange)="modalVisible.set($event)"
  (submitted)="submit()"
  (cancelled)="closeModal()"
  (closeActionClicked)="switchToClose()"
>
  @if (modalMode() !== 'close') {
    <div class="address-form">
      @if (modalMode() === 'create') {
        <label class="address-form__field">
          <span>{{ texts.addressesSectionTypeLabel }}</span>
          <app-ui-select
            [disabled]="catalogLoading() || saving()"
            [value]="draft().addressTypeCode"
            [options]="addressTypeOptions()"
            [placeholder]="texts.addressesSectionTypeLabel"
            (valueChanged)="updateDraft('addressTypeCode', $event)"
          />
        </label>
        <label class="address-form__field">
          <span>{{ texts.addressesSectionStartDateLabel }}</span>
          <app-ui-date-input [value]="draft().startDate" (valueChanged)="updateDraft('startDate', $event)" />
        </label>
      } @else {
        <!-- Las fechas no se corrigen desde aquí: lo que se toca son los datos de la vigente. -->
        <p class="address-form__hint">{{ texts.addressesSectionEditCurrentHint }}</p>
      }
      <label class="address-form__field address-form__field--wide">
        <span>{{ texts.addressesSectionStreetLabel }}</span>
        <input pInputText type="text" [value]="draft().street" (input)="updateDraft('street', $any($event.target).value)" />
      </label>
      <label class="address-form__field">
        <span>{{ texts.addressesSectionPostalCodeLabel }}</span>
        <input pInputText type="text" [value]="draft().postalCode" (input)="updateDraft('postalCode', $any($event.target).value)" />
      </label>
      <label class="address-form__field">
        <span>{{ texts.addressesSectionCityLabel }}</span>
        <input pInputText type="text" [value]="draft().city" (input)="updateDraft('city', $any($event.target).value)" />
      </label>
      <label class="address-form__field">
        <span>{{ texts.addressesSectionRegionLabel }}</span>
        <input pInputText type="text" [value]="draft().regionCode" (input)="updateDraft('regionCode', $any($event.target).value)" />
      </label>
      <label class="address-form__field">
        <span>{{ texts.addressesSectionCountryLabel }}</span>
        <input pInputText type="text" [value]="draft().countryCode" (input)="updateDraft('countryCode', $any($event.target).value)" />
      </label>
    </div>
  } @else {
    <div class="address-form">
      <label class="address-form__field address-form__field--wide">
        <span>{{ texts.addressesSectionEndDateLabel }}</span>
        <app-ui-date-input [value]="endDateDraft()" (valueChanged)="endDateDraft.set($event)" />
      </label>
    </div>
  }
</app-period-modal>
