<app-temporal-section
  anchorId="employee-section-addresses"
  [title]="texts.addressesSectionTitle"
  [rows]="rows()"
  [addLabel]="texts.addressesSectionAddAction"
  [emptyMessage]="texts.addressesSectionEmptyMessage"
  (addClicked)="openAdd()"
  (editClicked)="openCorrect($event)"
  (deleteClicked)="openRemove($event)"
>
  <ng-template #columnHeaders>
    <th class="temporal-section__th">{{ texts.addressesSectionTypeLabel }}</th>
    <th class="temporal-section__th">{{ texts.addressesSectionAddressColumn }}</th>
  </ng-template>
  <ng-template #cellContent let-row>
    <!-- ADR-051 §4: el código nunca va solo. -->
    <td class="temporal-section__td">
      <app-ui-catalog-label [name]="row.addressTypeName" [code]="row.addressTypeCode" />
    </td>
    <td class="temporal-section__td">
      {{ row.street }}
      <span class="temporal-section__secondary address-row__locality">
        @if (row.locality) {
          {{ row.locality }} ·
        }
        {{ row.countryCode }}
      </span>
    </td>
  </ng-template>
</app-temporal-section>

<!-- El aviso bajo el formulario es el plan del backend (ADR-057): qué dirección del mismo tipo
     se cierra y en qué fecha, el hueco que queda —rechazo en el domicilio, consecuencia legal en
     los demás tipos— o el solape que impide confirmar. Cuando el rechazo nombra una corrección,
     el aviso trae también la salida. -->
<app-period-modal
  [title]="modalTitle()"
  [subtitle]="modalSubtitle()"
  [visible]="modalVisible()"
  [saving]="saving()"
  [submitEnabled]="isSubmitEnabled()"
  [submitLabel]="submitLabel()"
  [note]="noteLines()"
  [noteTone]="noteTone()"
  [noteActionLabel]="correctionOffer()"
  (visibleChange)="modalVisible.set($event)"
  (submitted)="submit()"
  (cancelled)="closeModal()"
  (noteActionClicked)="switchToCorrection()"
>
  @if (modalMode() !== 'remove') {
    <div class="address-form">
      @if (modalMode() === 'add') {
        <label class="address-form__field">
          <span>{{ texts.addressesSectionTypeLabel }}</span>
          <app-ui-select
            [disabled]="catalogLoading() || saving()"
            [value]="draft().addressTypeCode"
            [options]="addressTypeOptions()"
            [placeholder]="texts.addressesSectionTypeLabel"
            (valueChanged)="updateDraft('addressTypeCode', $event)"
          />
        </label>
      }
      <label class="address-form__field">
        <span>{{ texts.addressesSectionStartDateLabel }}</span>
        <app-ui-date-input
          [value]="draft().startDate"
          (valueChanged)="updateDraft('startDate', $event)"
        />
      </label>
      <label class="address-form__field">
        <span>{{ texts.addressesSectionEndDateLabel }}</span>
        <app-ui-date-input
          [value]="draft().endDate"
          (valueChanged)="updateDraft('endDate', $event)"
        />
      </label>
      <label class="address-form__field address-form__field--wide">
        <span>{{ texts.addressesSectionStreetLabel }}</span>
        <input
          pInputText
          type="text"
          [value]="draft().street"
          (input)="updateDraft('street', $any($event.target).value)"
        />
      </label>
      <label class="address-form__field">
        <span>{{ texts.addressesSectionPostalCodeLabel }}</span>
        <input
          pInputText
          type="text"
          [value]="draft().postalCode"
          (input)="updateDraft('postalCode', $any($event.target).value)"
        />
      </label>
      <label class="address-form__field">
        <span>{{ texts.addressesSectionCityLabel }}</span>
        <input
          pInputText
          type="text"
          [value]="draft().city"
          (input)="updateDraft('city', $any($event.target).value)"
        />
      </label>
      <label class="address-form__field">
        <span>{{ texts.addressesSectionRegionLabel }}</span>
        <input
          pInputText
          type="text"
          [value]="draft().regionCode"
          (input)="updateDraft('regionCode', $any($event.target).value)"
        />
      </label>
      <label class="address-form__field">
        <span>{{ texts.addressesSectionCountryLabel }}</span>
        <input
          pInputText
          type="text"
          [value]="draft().countryCode"
          (input)="updateDraft('countryCode', $any($event.target).value)"
        />
      </label>
    </div>
  }
</app-period-modal>
