<app-temporal-section
  anchorId="employee-section-cost-center"
  title="Centro de coste"
  [addLabel]="texts.costCenterSectionAddTitle"
  [rows]="rows()"
  (addClicked)="openAdd()"
  (editClicked)="openCorrect($event)"
  (deleteClicked)="openRemove($event)"
>
  <ng-template #columnHeaders>
    <th class="temporal-section__th">Centros</th>
    <th class="temporal-section__th">Total</th>
  </ng-template>
  <ng-template #cellContent let-row>
    <td class="temporal-section__td">{{ row.itemsSummary }}</td>
    <td
      class="temporal-section__td"
      [class.temporal-section__total--ok]="row.totalPercentage === 100"
      [class.temporal-section__total--err]="row.totalPercentage !== 100"
    >
      {{ row.totalPercentage }} %
    </td>
  </ng-template>
</app-temporal-section>

<!-- El aviso bajo el formulario es el plan del backend (ADR-057): qué ventana se cierra o se
     reabre y en qué fecha, y el hueco que quedaría. Aquí el hueco no impide nada: la cobertura
     de centro de coste es opcional (`backend#54`) y el aviso dice que se queda y que es
     válido. -->
<app-period-modal
  [title]="modalTitle()"
  [subtitle]="modalSubtitle()"
  [visible]="modalVisible()"
  [saving]="saving()"
  [submitEnabled]="isSubmitEnabled()"
  [submitLabel]="submitLabel()"
  [note]="noteLines()"
  [noteTone]="noteTone()"
  [noteActionLabel]="correctionOffer()"
  (visibleChange)="modalVisible.set($event)"
  (submitted)="submit()"
  (cancelled)="closeModal()"
  (noteActionClicked)="switchToCorrection()"
>
  @if (modalVisible() && modalMode() !== 'remove') {
    <app-ui-date-input
      [ariaLabel]="texts.costCenterSectionStartDateLabel"
      [value]="startDateDraft()"
      (valueChanged)="startDateDraft.set($event)"
    />
    <app-ui-date-input
      [ariaLabel]="texts.costCenterSectionEndDateLabel"
      [value]="endDateDraft()"
      (valueChanged)="endDateDraft.set($event)"
    />
    <app-employee-cost-center-distribution-editor
      [showDateField]="false"
      [initialValue]="editorInitialValue()"
      [options]="costCenterOptions()"
    />
  }
</app-period-modal>
