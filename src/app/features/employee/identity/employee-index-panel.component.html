<div class="index-panel">
  <!-- El índice de la página (ADR-050): anclas de la relación con su recuento —en gris las
       vacías, en ocre las vacías que son un dato que falta—, y las dos secciones de ruta. No se
       pliega a iconos. -->
  <nav class="index-panel__nav" [attr.aria-label]="texts.detailNavAriaLabel">
    @for (group of navGroups(); track group.label) {
      <span class="index-panel__nav-group">{{ group.label }}</span>
      @for (item of group.items; track item.id) {
        <a
          class="index-panel__nav-item"
          [class.active]="isActive(item)"
          [class.index-panel__nav-item--empty]="item.count === 0"
          [class.index-panel__nav-item--empty-warn]="isEmptyAnomaly(item)"
          [routerLink]="item.routeCommands"
          [fragment]="item.anchor ?? undefined"
          [attr.aria-current]="isActive(item) ? 'true' : null"
        >
          <b4-icon class="index-panel__nav-icon" [name]="item.icon" [size]="16" />
          <span class="index-panel__nav-label">{{ item.label }}</span>
          @if (item.count !== null) {
            <span class="index-panel__nav-count">{{ item.count }}</span>
          }
        </a>
      }
    }
  </nav>
</div>
