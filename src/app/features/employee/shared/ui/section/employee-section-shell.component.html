<app-section-card [title]="title()" [description]="hasSubtitle() ? subtitle() : null">
  @if (hasActions()) {
    <div sectionCardActions class="employee-section-shell__header-actions">
      @for (action of actions(); track action.label) {
        <app-ui-button
          type="button"
          size="small"
          severity="secondary"
          [outlined]="true"
          [disabled]="action.disabled ?? false"
          [label]="(action.icon ? action.icon + ' ' : '') + action.label"
        />
      }
    </div>
  }

  <ng-content select="[sectionCardActions]"></ng-content>

  <ng-content></ng-content>

  @if (hasFooterState()) {
    <footer
      sectionCardFooter
      class="employee-section-shell__footer"
      role="status"
      aria-live="polite"
    >
      @if (showBusy()) {
        <p class="employee-section-shell__status employee-section-shell__status--busy">
          Procesando cambios...
        </p>
      }
    </footer>
  }
</app-section-card>
