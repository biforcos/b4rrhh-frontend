<section class="slot-section" [attr.aria-label]="title()">
  <app-section-heading
    [title]="title()"
    [addLabel]="addLabel()"
    [addDisabled]="addDisabled()"
    (addClicked)="addClicked.emit()"
  >
    @if (count() > 0) {
      <span sectionHeadingMeta class="section-heading__meta">{{ count() }}</span>
    }
  </app-section-heading>

  <!-- El vacío es contenido: dice qué falta y cómo añadirlo, sin otra caja (ADR-051 §3). -->
  @if (showEmpty()) {
    <p class="slot-section__empty">{{ emptyMessage() }}</p>
  }

  <ng-content />
</section>
