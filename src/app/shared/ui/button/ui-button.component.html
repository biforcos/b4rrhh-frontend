<button
  pButton
  [type]="type()"
  [severity]="severity()"
  [size]="size()"
  [outlined]="outlined()"
  [text]="text()"
  [rounded]="rounded()"
  [disabled]="disabled()"
  [fluid]="fluid()"
  [ariaLabel]="ariaLabel()"
  [attr.title]="title() ?? null"
  (click)="emitPressed($event)"
>
  @if (icon(); as name) {
    <b4-icon [name]="name" [size]="16" />
  }
  <span class="p-button-label">{{ label() }}</span>
</button>
